  <!-- Pure Detection Engine (Vanilla JS, inline for 100% file:// compatibility) -->
  <script>
    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Helper: Convert #HEX to RGB object
    function hexToRgb(hex) {
      if (!hex || typeof hex !== 'string') return null;
      let cleanHex = hex.trim().replace(/^#/, '');
      if (cleanHex.length === 3) {
        cleanHex = cleanHex.split('').map(c => c + c).join('');
      }
      if (cleanHex.length !== 6) return null;
      const num = parseInt(cleanHex, 16);
      if (isNaN(num)) return null;
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    // Helper: Euclidean color distance in RGB space
    function colorDistance(c1, c2) {
      return Math.sqrt(
        Math.pow(c1.r - c2.r, 2) +
        Math.pow(c1.g - c2.g, 2) +
        Math.pow(c1.b - c2.b, 2)
      );
    }

    // Visual Consistency Check: flags if hexValue is not in approved palette
    function checkVisualConsistency(hexValue, palette = []) {
      if (!hexValue || typeof hexValue !== 'string' || !hexValue.trim()) return null;
      const cleanHex = (hexValue.trim().startsWith('#') ? hexValue.trim() : `#${hexValue.trim()}`).toUpperCase();
      const inputRgb = hexToRgb(cleanHex);
      if (!inputRgb) return null;

      // Exact match in approved palette
      const isApproved = (palette || []).some(p => p.hex.toUpperCase() === cleanHex);
      if (isApproved) {
        return null;
      }

      // Find closest approved color
      let closest = (palette && palette.length > 0) ? palette[0] : { hex: "#1F2A44", name: "Brand Navy" };
      let minDistance = Infinity;

      for (const item of (palette || [])) {
        const palRgb = hexToRgb(item.hex);
        if (!palRgb) continue;
        const dist = colorDistance(inputRgb, palRgb);
        if (dist < minDistance) {
          minDistance = dist;
          closest = item;
        }
      }

      return {
        id: `issue-visual-${Date.now()}-1`,
        type: 'Visual consistency',
        severity: 'Medium',
        snippet: cleanHex,
        reason: `Unapproved brand color "${cleanHex}" detected. Closest approved match is ${closest.name} (${closest.hex}).`,
        sourceRef: `Palette: ${closest.name} (${closest.hex})`,
        suggestedRewrite: closest.hex,
        status: 'open'
      };
    }

    function reviewContent(text, glossary = [], claims = [], voiceRules = [], brandColor = null, palette = []) {
      const issues = [];
      if (!text || typeof text !== 'string') return issues;

      // 1. Unsupported claim (High)
      const claimRegex = /\b\d{1,3}x\b|\b100%\b|#1\b|\bguaranteed\b/i;
      const claimMatch = text.match(claimRegex);
      if (claimMatch) {
        const claimRef = claims[0] || {
          text: "Up to 35% faster in batch-processing tests",
          source: "Claims Sheet v2.3, section 4"
        };
        issues.push({
          id: `issue-claim-${Date.now()}-1`,
          type: 'Unsupported claim',
          severity: 'High',
          snippet: claimMatch[0],
          reason: `Unsupported performance claim detected: "${claimMatch[0]}". Cites: "${claimRef.text}" (${claimRef.source}).`,
          sourceRef: claimRef.source,
          suggestedRewrite: `${claimRef.text} based on our internal benchmark.`,
          status: 'open'
        });
      }

      // 2. Tone mismatch (Medium)
      const slangWords = ["yo", "dope", "gonna", "lol", "omg", "lit"];
      const slangRegex = new RegExp(`\\b(${slangWords.join('|')})\\b`, 'i');
      const exclRegex = /!{2,}/;
      const hasSlang = slangRegex.test(text);
      const hasExcl = exclRegex.test(text);

      if (hasSlang || hasExcl) {
        const voiceRule = voiceRules[0] || { text: "Confident and friendly, never slang-heavy" };
        const matchedSnippets = [];
        const slangMatches = text.match(new RegExp(`\\b(${slangWords.join('|')})\\b`, 'gi'));
        if (slangMatches) matchedSnippets.push(...slangMatches);
        const exclMatches = text.match(/!{2,}/g);
        if (exclMatches) matchedSnippets.push(...exclMatches);

        let neutralizedText = text;
        neutralizedText = neutralizedText.replace(/!{2,}/g, '.');
        const slangMap = { yo: '', dope: 'great', gonna: 'going to', lol: '', omg: '', lit: 'impressive' };
        for (const slang of slangWords) {
          const reg = new RegExp(`\\b${slang}\\b[!,]?\\s*`, 'gi');
          neutralizedText = neutralizedText.replace(reg, (match) => {
            const rep = slangMap[slang.toLowerCase()];
            return rep ? rep + ' ' : '';
          });
        }
        neutralizedText = neutralizedText.trim();
        if (neutralizedText.length > 0) {
          neutralizedText = neutralizedText.charAt(0).toUpperCase() + neutralizedText.slice(1);
        }

        issues.push({
          id: `issue-tone-${Date.now()}-2`,
          type: 'Tone mismatch',
          severity: 'Medium',
          snippet: matchedSnippets.join(', '),
          reason: `Tone violates voice rule: "${voiceRule.text}"`,
          sourceRef: voiceRule.text,
          suggestedRewrite: neutralizedText,
          status: 'open'
        });
      }

      // 3. Terminology inconsistency (Low)
      if (Array.isArray(glossary)) {
        let termIdx = 0;
        for (const item of glossary) {
          if (!item.avoidTerm) continue;
          const termRegex = new RegExp(`\\b${escapeRegExp(item.avoidTerm)}\\b`, 'i');
          const termMatch = text.match(termRegex);
          if (termMatch) {
            issues.push({
              id: `issue-term-${Date.now()}-${termIdx++}`,
              type: 'Terminology inconsistency',
              severity: 'Low',
              snippet: termMatch[0],
              reason: `Found unapproved term "${item.avoidTerm}". Use approved term "${item.approvedTerm}".`,
              sourceRef: `Glossary: ${item.avoidTerm} -> ${item.approvedTerm}`,
              suggestedRewrite: item.approvedTerm,
              status: 'open'
            });
          }
        }
      }

      // 4. Visual consistency (Medium) — optional, runs only if brandColor provided
      if (brandColor && typeof brandColor === 'string' && brandColor.trim()) {
        const visualIssue = checkVisualConsistency(brandColor, palette);
        if (visualIssue) {
          issues.push(visualIssue);
        }
      }

      return issues;
    }

    if (typeof window !== 'undefined') {
      window.escapeRegExp = escapeRegExp;
      window.hexToRgb = hexToRgb;
      window.colorDistance = colorDistance;
      window.checkVisualConsistency = checkVisualConsistency;
      window.reviewContent = reviewContent;
    }
  </script>

// --- Live Inline Non-Destructive Highlight Renderer ---
function renderLiveHighlights(text, issues) {
  if (!text) return null;
  const openIssues = (issues || []).filter(i => i.status === 'open');
  if (openIssues.length === 0) {
    return <span className="text-slate-800">{text}</span>;
  }

  // Collect match regions
  const matches = [];
  openIssues.forEach(issue => {
    if (!issue.snippet) return;
    // Split multi-snippet issues (e.g. tone mismatches "Yo!, !!") so each piece is highlighted
    const parts = issue.snippet.split(',').map(s => s.trim()).filter(Boolean);
    parts.forEach(part => {
      try {
        const reg = new RegExp(window.escapeRegExp(part), 'gi');
        let m;
        while ((m = reg.exec(text)) !== null) {
          matches.push({
            start: m.index,
            end: m.index + m[0].length,
            snippet: m[0],
            issue
          });
        }
      } catch (e) { }
    });
  });

  if (matches.length === 0) {
    return <span className="text-slate-800">{text}</span>;
  }

  // Sort and resolve overlaps
  matches.sort((a, b) => a.start - b.start);
  const cleanMatches = [];
  let lastEnd = 0;
  for (const m of matches) {
    if (m.start >= lastEnd) {
      cleanMatches.push(m);
      lastEnd = m.end;
    }
  }

  const nodes = [];
  let curr = 0;
  cleanMatches.forEach((m, idx) => {
    if (m.start > curr) {
      nodes.push(<span key={`txt-${idx}`}>{text.slice(curr, m.start)}</span>);
    }
    const t = (m.issue.type || '').toLowerCase();
    let flagCls = 'flag-terminology';
    if (t.includes('claim')) flagCls = 'flag-claim';
    else if (t.includes('tone')) flagCls = 'flag-tone';

    nodes.push(
      <mark
        key={`flag-${idx}`}
        className={`${flagCls} cursor-pointer transition-colors`}
        title={`${m.issue.type}: ${m.issue.reason}`}
      >
        {text.slice(m.start, m.end)}
      </mark>
    );
    curr = m.end;
  });

  if (curr < text.length) {
    nodes.push(<span key="txt-end">{text.slice(curr)}</span>);
  }

  return nodes;
}

  const TWEAKED_EXAMPLE = "Yo! Our product is 10x faster than any competitor, and new users can get started right away on the Sign-Up Portal!! Plus, our cheap setup is guaranteed.";

  const [editingIssueId, setEditingIssueId] = useState(null);
  const [editValue, setEditValue] = useState('');

  const [dismissingIssueId, setDismissingIssueId] = useState(null);
  const [dismissComment, setDismissComment] = useState('');
  const [dismissError, setDismissError] = useState('');

  const [viewMode, setViewMode] = useState('editor'); // 'editor' | 'preview'

  const hasIssues = activeItem.issues && activeItem.issues.length > 0;
  const openIssues = (activeItem.issues || []).filter(i => i.status === 'open');
  const openCount = openIssues.length;
  const resolvedCount = (activeItem.issues || []).filter(i => i.status === 'resolved').length;

  // Strict submission gate: enabled ONLY when review has run and 0 open issues remain
  const isSendEnabled = (activeItem.status === 'in_review' || activeItem.status === 'sent_back') &&
    activeItem.issues &&
    activeItem.issues.length > 0 &&
    openCount === 0;

  const handleStartEdit = (issue) => {
    setEditingIssueId(issue.id);
    setEditValue(issue.suggestedRewrite);
    setDismissingIssueId(null);
  };

  const handleConfirmEdit = (issue) => {
    if (!editValue.trim()) return;
    onEditIssue(issue, editValue.trim());
    setEditingIssueId(null);
    setEditValue('');
  };

  const handleStartDismiss = (issue) => {
    setDismissingIssueId(issue.id);
    setDismissComment('');
    setDismissError('');
    setEditingIssueId(null);
  };

  const handleConfirmDismiss = (issue) => {
    if (!dismissComment.trim()) {
      setDismissError('A one-line justification comment is strictly required to dismiss.');
      return;
    }
    onDismissIssue(issue, dismissComment.trim());
    setDismissingIssueId(null);
    setDismissComment('');
    setDismissError('');
  };

  return (
    <div className="max-w-7xl mx-auto space-y-4 animate-fadeIn">
      {/* Sent Back Banner if Reviewer requested revisions */}
      {activeItem.status === 'sent_back' && (
        <div className="bg-rose-50/70 border border-rose-200/80 rounded-lg p-3.5 flex items-start space-x-3 text-xs">
          <div className="text-rose-600 mt-0.5">
            <AlertTriangleIcon className="w-4 h-4" />
          </div>
          <div className="flex-1 space-y-1">
            <div className="font-semibold text-rose-900 flex items-center space-x-2">
              <span>Revisions Requested by Brand Reviewer</span>
              <span className="text-[10px] bg-rose-200 text-rose-800 px-1.5 py-0.2 rounded font-mono">Loop to in_review</span>
            </div>
            <p className="text-rose-700 italic">
              "{activeItem.reviewerComment || 'Please revise violations and resubmit.'}"
            </p>
            <p className="text-slate-500 text-[11px]">
              Apply the required corrections below and click <strong>"Resubmit & Review"</strong> to re-enter the compliance stream.
            </p>
          </div>
        </div>
      )}

      {/* Main Split-Screen Workspace (Left: Editor & Inspection / Right: Issue Stream) */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
        {/* Left Column: Editor & Live Inspection (7 cols) */}
        <div className="lg:col-span-7 space-y-4">
          <div className="bg-white border border-slate-200/80 rounded-lg shadow-xs overflow-hidden">
            {/* Editor Toolbar */}
            <div className="px-4 py-2.5 border-b border-slate-200/80 bg-slate-50/50 flex flex-wrap items-center justify-between gap-2 text-xs">
              <div className="flex flex-wrap items-center gap-2">
                <div className="flex items-center space-x-1.5">
                  <span className="text-slate-400 font-medium">Format:</span>
                  <select
                    value={activeItem.contentType}
                    onChange={(e) => onUpdateDraft({ contentType: e.target.value })}
                    className="bg-white border border-slate-200 text-slate-700 rounded px-2 py-1 text-xs font-medium focus:outline-none focus:ring-1 focus:ring-slate-400"
                  >
                    <option value="Email">Email Campaign</option>
                    <option value="Web Page">Web Page / Landing</option>
                    <option value="Social Post">Social Post</option>
                  </select>
                  <StatusBadge status={activeItem.status} />
                </div>

                {/* Optional Brand Color Used (Phase 9) */}
                <div className="flex items-center space-x-1.5 pl-2 sm:border-l sm:border-slate-200">
                  <span className="text-slate-400 font-medium text-[11px]" title="Optional brand color used in creative assets">
                    Color:
                  </span>
                  <div className="flex items-center space-x-1 bg-white border border-slate-200 rounded px-1.5 py-0.5">
                    <input
                      type="color"
                      value={activeItem.brandColor || "#1F2A44"}
                      onChange={(e) => onUpdateDraft({ brandColor: e.target.value.toUpperCase() })}
                      className="w-4 h-4 rounded cursor-pointer border-0 p-0 bg-transparent shrink-0"
                      title="Pick brand color used (optional)"
                    />
                    <input
                      type="text"
                      placeholder="#HEX (opt)"
                      value={activeItem.brandColor || ''}
                      onChange={(e) => onUpdateDraft({ brandColor: e.target.value.toUpperCase() })}
                      className="w-18 font-mono text-[11px] text-slate-700 bg-transparent focus:outline-none"
                    />
                    {activeItem.brandColor && (
                      <button
                        type="button"
                        onClick={() => onUpdateDraft({ brandColor: '' })}
                        className="text-slate-400 hover:text-slate-600 p-0.5"
                        title="Clear color"
                      >
                        <XIcon className="w-3 h-3" />
                      </button>
                    )}
                  </div>
                </div>
              </div>

              {/* Sample Draft Quick Actions */}
              <div className="flex items-center space-x-1.5">
                <button
                  type="button"
                  onClick={() => onUpdateDraft({ text: TEST_EXAMPLE, brandColor: '#1F2A44', status: 'draft', issues: [], reviewerComment: '' })}
                  className="px-2.5 py-1 text-xs font-medium rounded text-slate-600 hover:text-slate-900 hover:bg-slate-200/60 transition-colors border border-slate-200 bg-white"
                  title="Fills standard test example with approved Brand Navy"
                >
                  Load Sample Copy
                </button>
                <button
                  type="button"
                  onClick={() => onUpdateDraft({ text: TWEAKED_EXAMPLE, brandColor: '#3B82F6', status: 'draft', issues: [], reviewerComment: '' })}
                  className="px-2.5 py-1 text-xs font-medium rounded text-slate-600 hover:text-slate-900 hover:bg-slate-200/60 transition-colors border border-slate-200 bg-white"
                  title="Loads copy with unapproved color #3B82F6 & extended terms"
                >
                  Load Extended
                </button>
              </div>
            </div>

            {/* Segmented View Mode (Draft Input vs. Live Inspection Preview) */}
            <div className="px-4 pt-3 flex items-center justify-between text-xs">
              <div className="inline-flex rounded-md bg-slate-100 p-0.5 border border-slate-200/60">
                <button
                  type="button"
                  onClick={() => setViewMode('editor')}
                  className={`px-3 py-1 rounded text-xs font-medium transition-all ${viewMode === 'editor'
                    ? 'bg-white text-slate-900 shadow-xs'
                    : 'text-slate-500 hover:text-slate-800'
                    }`}
                >
                  Draft Editor
                </button>
                <button
                  type="button"
                  onClick={() => setViewMode('preview')}
                  className={`px-3 py-1 rounded text-xs font-medium transition-all flex items-center space-x-1.5 ${viewMode === 'preview'
                    ? 'bg-white text-slate-900 shadow-xs'
                    : 'text-slate-500 hover:text-slate-800'
                    }`}
                >
                  <span>Live Inspection</span>
                  {openCount > 0 && (
                    <span className="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
                  )}
                </button>
              </div>

              <div className="text-[11px] text-slate-400 font-mono">
                {activeItem.text.length} chars • {activeItem.text.trim() ? activeItem.text.trim().split(/\s+/).length : 0} words
              </div>
            </div>

            {/* Input Surface */}
            <div className="p-4">
              {viewMode === 'editor' ? (
                <textarea
                  rows={6}
                  value={activeItem.text}
                  onChange={(e) => onUpdateDraft({ text: e.target.value })}
                  placeholder="Paste or draft marketing copy, announcements, or email content here..."
                  className="w-full text-slate-900 text-sm leading-relaxed placeholder-slate-400 bg-slate-50/40 border border-slate-200/90 rounded-md p-3.5 focus:bg-white focus:outline-none focus:border-slate-400 focus:ring-1 focus:ring-slate-400 transition-colors font-sans"
                />
              ) : (
                <div className="min-h-[148px] bg-slate-50/50 border border-slate-200/80 rounded-md p-3.5 text-sm leading-relaxed text-slate-800 space-y-2">
                  <div className="text-[11px] font-medium text-slate-400 uppercase tracking-wider flex items-center justify-between pb-1.5 border-b border-slate-200/60">
                    <span>Active Document Markup</span>
                    <div className="flex items-center space-x-3 text-[10px] font-sans lowercase">
                      <span className="flex items-center space-x-1">
                        <span className="w-2 h-2 rounded-xs bg-rose-300"></span>
                        <span className="text-slate-500">claim</span>
                      </span>
                      <span className="flex items-center space-x-1">
                        <span className="w-2 h-2 rounded-xs bg-amber-300"></span>
                        <span className="text-slate-500">tone</span>
                      </span>
                      <span className="flex items-center space-x-1">
                        <span className="w-2 h-2 rounded-xs bg-sky-300"></span>
                        <span className="text-slate-500">term</span>
                      </span>
                    </div>
                  </div>
                  <div className="pt-1">
                    {renderLiveHighlights(activeItem.text, activeItem.issues)}
                  </div>
                </div>
              )}
            </div>

            {/* Bottom Primary Bar */}
            <div className="px-4 py-3 bg-slate-50/60 border-t border-slate-200/80 flex items-center justify-between text-xs">
              <span className="text-slate-500 text-[11px]">
                {activeItem.status === 'sent_back'
                  ? 'Re-evaluate copy to clear reviewer flag'
                  : 'Checks claims §4, voice charter & live terminology'}
              </span>

              <button
                type="button"
                onClick={() => {
                  onReviewContent();
                  setViewMode('preview');
                }}
                disabled={!activeItem.text.trim()}
                className={`inline-flex items-center space-x-1.5 px-3.5 py-1.5 rounded-md text-xs font-medium transition-all shadow-xs ${activeItem.text.trim()
                  ? 'bg-slate-900 hover:bg-slate-800 text-white cursor-pointer'
                  : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                  }`}
              >
                <SparklesIcon className="w-3.5 h-3.5 text-slate-300" />
                <span>{activeItem.status === 'sent_back' ? 'Resubmit & Review' : 'Run Brand Review'}</span>
              </button>
            </div>
          </div>

          {/* Quality Gate / Submission Lock Banner */}
          {activeItem.status !== 'draft' && (
            <div className={`p-4 rounded-lg border text-xs transition-all ${isSendEnabled
              ? 'bg-emerald-50/60 border-emerald-200/80 text-emerald-900'
              : 'bg-slate-50/80 border-slate-200 text-slate-600'
              }`}>
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div className="flex items-start space-x-2.5">
                  <div className={`mt-0.5 p-1 rounded-full ${isSendEnabled ? 'bg-emerald-600 text-white' : 'bg-slate-300 text-slate-600'}`}>
                    <CheckIcon className="w-3 h-3" />
                  </div>
                  <div>
                    <h4 className="font-semibold text-slate-900 text-xs">
                      {isSendEnabled ? 'Quality Gate Passed • 0 Open Violations' : 'Governance Approval Lock'}
                    </h4>
                    <p className="text-[11px] text-slate-500 mt-0.5">
                      {isSendEnabled
                        ? `All ${activeItem.issues.length} detected brand issues are resolved. Ready to submit for compliance sign-off.`
                        : `Draft has ${openCount} unresolved violation${openCount === 1 ? '' : 's'}. You must Accept, Edit, or Dismiss all flags before submission.`}
                    </p>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={onSendForReview}
                  disabled={!isSendEnabled}
                  className={`inline-flex items-center space-x-1.5 px-4 py-2 rounded-md text-xs font-medium transition-all shadow-xs self-start sm:self-auto ${isSendEnabled
                    ? 'bg-slate-900 hover:bg-slate-800 text-white cursor-pointer'
                    : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                    }`}
                  title={isSendEnabled ? 'Promote to Pending Approval' : 'Resolve all issues first'}
                >
                  <span>Send for Approval</span>
                  <ArrowRightIcon className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>
          )}
        </div>

        {/* Right Column: GitHub PR Review Style Issue Stream (5 cols) */}
        <div className="lg:col-span-5 space-y-3">
          <div className="flex items-center justify-between pb-1 text-xs">
            <div className="flex items-center space-x-2">
              <h3 className="font-semibold text-slate-900">Governance Audit Stream</h3>
              <span className="text-[11px] font-mono px-2 py-0.2 rounded-full bg-slate-100 text-slate-700 border border-slate-200">
                {openCount} open / {activeItem.issues ? activeItem.issues.length : 0} total
              </span>
            </div>

            {resolvedCount > 0 && (
              <span className="text-[11px] text-emerald-700 font-medium">
                {resolvedCount} resolved ✓
              </span>
            )}
          </div>

          {!hasIssues && activeItem.status === 'draft' && (
            <div className="bg-white border border-dashed border-slate-300 rounded-lg p-8 text-center text-xs text-slate-500 space-y-2">
              <div className="mx-auto w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                <FileTextIcon className="w-4 h-4" />
              </div>
              <p className="font-medium text-slate-700">No Review Active</p>
              <p className="text-[11px] text-slate-400 max-w-xs mx-auto">
                Paste draft copy or click "Load Sample Copy", then click "Run Brand Review" to audit against claims, tone, and terminology.
              </p>
            </div>
          )}

          {hasIssues && activeItem.issues.map((issue, idx) => {
            const isOpen = issue.status === 'open';

            return (
              <div
                key={issue.id}
                className={`bg-white border rounded-lg p-3.5 shadow-xs transition-all space-y-2.5 ${isOpen
                  ? 'border-slate-200/90'
                  : 'border-slate-200/60 bg-slate-50/40 opacity-80'
                  }`}
              >
                {/* Header: Line anchor + Severity Pill + Rule Citation */}
                <div className="flex items-center justify-between gap-2 text-xs">
                  <div className="flex items-center space-x-2">
                    <span className="font-mono text-[10px] text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200/60">
                      § Rule {idx + 1}
                    </span>
                    <SeverityBadge severity={issue.severity} type={issue.type} />
                  </div>

                  <span className="text-[10px] text-slate-400 font-mono truncate max-w-[140px]" title={issue.sourceRef}>
                    {issue.sourceRef}
                  </span>
                </div>

                {/* Violation Reason */}
                <p className="text-xs text-slate-700 leading-relaxed font-sans">
                  {issue.reason}
                </p>

                {/* Diff View Box */}
                {isOpen && (
                  <IssueDiffView
                    snippet={issue.snippet}
                    suggestedRewrite={issue.suggestedRewrite}
                  />
                )}

                {/* Actions when OPEN */}
                {isOpen && (
                  <div>
                    {/* Inline Edit Form */}
                    {editingIssueId === issue.id ? (
                      <div className="p-2.5 rounded bg-slate-50 border border-slate-200 space-y-2">
                        <label className="block text-[11px] font-semibold text-slate-700">
                          Custom Replacement:
                        </label>
                        <input
                          type="text"
                          value={editValue}
                          onChange={(e) => setEditValue(e.target.value)}
                          className="w-full text-xs bg-white border border-slate-300 rounded px-2.5 py-1.5 text-slate-800 focus:outline-none focus:ring-1 focus:ring-slate-400"
                        />
                        <div className="flex items-center justify-end space-x-2 pt-1">
                          <button
                            type="button"
                            onClick={() => setEditingIssueId(null)}
                            className="px-2 py-1 text-[11px] text-slate-500 hover:text-slate-800"
                          >
                            Cancel
                          </button>
                          <button
                            type="button"
                            onClick={() => handleConfirmEdit(issue)}
                            className="px-2.5 py-1 text-[11px] font-medium bg-slate-900 text-white rounded hover:bg-slate-800"
                          >
                            Apply Edit
                          </button>
                        </div>
                      </div>
                    ) : dismissingIssueId === issue.id ? (
                      <div className="p-2.5 rounded bg-slate-50 border border-slate-200 space-y-2">
                        <label className="block text-[11px] font-semibold text-slate-700">
                          Justification Comment <span className="text-rose-600">* (Required)</span>
                        </label>
                        <input
                          type="text"
                          value={dismissComment}
                          onChange={(e) => {
                            setDismissComment(e.target.value);
                            setDismissError('');
                          }}
                          placeholder="e.g., Legal verified exception for this launch..."
                          className="w-full text-xs bg-white border border-slate-300 rounded px-2.5 py-1.5 text-slate-800 focus:outline-none focus:ring-1 focus:ring-slate-400"
                        />
                        {dismissError && (
                          <p className="text-[11px] text-rose-600 font-medium">{dismissError}</p>
                        )}
                        <div className="flex items-center justify-end space-x-2 pt-1">
                          <button
                            type="button"
                            onClick={() => {
                              setDismissingIssueId(null);
                              setDismissError('');
                            }}
                            className="px-2 py-1 text-[11px] text-slate-500 hover:text-slate-800"
                          >
                            Cancel
                          </button>
                          <button
                            type="button"
                            onClick={() => handleConfirmDismiss(issue)}
                            className="px-2.5 py-1 text-[11px] font-medium bg-rose-600 text-white rounded hover:bg-rose-700"
                          >
                            Confirm Dismiss
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div className="flex items-center space-x-1.5 pt-1">
                        <button
                          type="button"
                          onClick={() => onAcceptIssue(issue)}
                          className="inline-flex items-center space-x-1 px-2.5 py-1 text-xs font-medium rounded bg-slate-900 hover:bg-slate-800 text-white shadow-xs transition-colors"
                        >
                          <CheckIcon className="w-3 h-3 text-emerald-400" />
                          <span>Accept Rewrite</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => handleStartEdit(issue)}
                          className="px-2.5 py-1 text-xs font-medium rounded text-slate-700 hover:text-slate-900 bg-white hover:bg-slate-50 border border-slate-200 transition-colors shadow-xs"
                        >
                          Edit
                        </button>
                        <button
                          type="button"
                          onClick={() => handleStartDismiss(issue)}
                          className="px-2 py-1 text-xs font-medium text-slate-500 hover:text-slate-800 transition-colors"
                        >
                          Dismiss
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* Summary Row when RESOLVED */}
                {!isOpen && (
                  <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-emerald-700 font-medium">
                    <span className="flex items-center space-x-1.5">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                      <span>{issue.resolution || 'Resolved'}</span>
                    </span>
                    <span className="text-slate-400 font-mono text-[10px]">cleared</span>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// --- Approval Board View (Minimalist Linear Kanban) ---
function ApprovalBoardView({
  contentItems = [],
  userRole = 'Creator',
  onRoleChange,
  onApprove,
  onSendBack,
  onEditInWorkspace
}) {
  const [sendBackModalItem, setSendBackModalItem] = useState(null);
  const [sendBackComment, setSendBackComment] = useState('');
  const [sendBackError, setSendBackError] = useState('');

  const pendingItems = contentItems.filter(i => i.status === 'pending_approval');
  const approvedItems = contentItems.filter(i => i.status === 'approved');
  const sentBackItems = contentItems.filter(i => i.status === 'sent_back');

  const handleConfirmSendBack = () => {
    if (!sendBackComment.trim()) {
      setSendBackError('A specific review comment is required before sending back.');
      return;
    }
    onSendBack(sendBackModalItem.id, sendBackComment.trim());
    setSendBackModalItem(null);
    setSendBackComment('');
    setSendBackError('');
  };

  return (
    <div className="max-w-7xl mx-auto space-y-4 animate-fadeIn">
      {/* Top Banner with Embedded Role Switcher */}
      <div className="bg-white border border-slate-200/80 rounded-lg p-3.5 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
        <div>
          <div className="flex items-center space-x-2">
            <h2 className="font-semibold text-slate-900 text-sm">Release Approval Board</h2>
            <span className="text-[10px] font-mono px-2 py-0.2 rounded-full bg-slate-100 text-slate-600 border border-slate-200">
              {pendingItems.length + approvedItems.length + sentBackItems.length} total drafts
            </span>
          </div>
          <p className="text-slate-500 text-[11px] mt-0.5">
            {userRole === 'Reviewer'
              ? 'Reviewer Authority Active: Approve publication or return drafts with mandatory revision feedback.'
              : 'Creator Mode Active: Viewing pipeline status. Toggle to "Reviewer" below or in header to test sign-off.'}
          </p>
        </div>

        <div className="flex items-center space-x-2">
          <span className="text-[11px] font-medium text-slate-500">Viewing as:</span>
          <div className="inline-flex bg-slate-100 p-0.5 rounded-md border border-slate-200 text-xs">
            <button
              type="button"
              onClick={() => onRoleChange && onRoleChange('Creator')}
              className={`px-2 py-0.5 rounded text-[11px] font-medium transition-all ${userRole === 'Creator'
                ? 'bg-white text-slate-900 shadow-xs font-semibold'
                : 'text-slate-500 hover:text-slate-800'
                }`}
            >
              Creator
            </button>
            <button
              type="button"
              onClick={() => onRoleChange && onRoleChange('Reviewer')}
              className={`px-2 py-0.5 rounded text-[11px] font-medium transition-all flex items-center space-x-1 ${userRole === 'Reviewer'
                ? 'bg-slate-900 text-white shadow-xs font-semibold'
                : 'text-slate-500 hover:text-slate-800'
                }`}
            >
              <span>Reviewer</span>
              <span className={`w-1.5 h-1.5 rounded-full ${userRole === 'Reviewer' ? 'bg-emerald-400' : 'bg-transparent'}`}></span>
            </button>
          </div>
        </div>
      </div>

      {/* 3-Column Minimalist Kanban Grid */}
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-start">
        {/* Column 1: Pending Review */}
        <div className="bg-slate-100/50 rounded-lg p-3 border border-slate-200/80 space-y-3">
          <div className="flex items-center justify-between pb-2 border-b border-slate-200/70 text-xs">
            <div className="flex items-center space-x-2">
              <span className="w-2 h-2 rounded-full bg-amber-500"></span>
              <span className="font-semibold text-slate-800">Pending Review</span>
            </div>
            <span className="text-[10px] font-mono font-semibold bg-white text-slate-700 px-1.5 py-0.2 rounded border border-slate-200">
              {pendingItems.length}
            </span>
          </div>

          {pendingItems.length === 0 ? (
            <div className="p-6 text-center text-xs text-slate-400 bg-white/60 rounded border border-dashed border-slate-200">
              No items pending sign-off.
            </div>
          ) : (
            pendingItems.map((item) => {
              const resolvedCount = (item.issues || []).filter(i => i.status === 'resolved').length;
              return (
                <div key={item.id} className="bg-white rounded-md border border-slate-200/80 p-3 shadow-xs space-y-2.5 text-xs">
                  <div className="flex items-center justify-between text-[11px]">
                    <div className="flex items-center space-x-1.5">
                      <span className="font-medium bg-slate-100 text-slate-700 px-2 py-0.5 rounded">
                        {item.contentType}
                      </span>
                      {item.brandColor && (
                        <span className="inline-flex items-center space-x-1 text-[10px] font-mono bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border border-slate-200" title={`Brand color: ${item.brandColor}`}>
                          <span className="w-2 h-2 rounded-full border border-slate-300" style={{ backgroundColor: item.brandColor }}></span>
                          <span>{item.brandColor}</span>

                      )}
                    </div>
                    <span className="font-mono text-slate-400 text-[10px]">
                      {item.submittedAt || 'Earlier'}
                    </span>
                  </div>

                  <p className="text-slate-800 line-clamp-3 leading-relaxed bg-slate-50/70 p-2 rounded border border-slate-100 font-sans">
                    "{item.text}"
                  </p>

                  <div className="pt-1 text-[11px] text-slate-500 flex items-center justify-between">
                    <span>✓ {resolvedCount} check{resolvedCount === 1 ? '' : 's'} verified</span>
                  </div>

                  {/* Reviewer Action Controls */}
                  {userRole === 'Reviewer' && (
                    <div className="pt-2 border-t border-slate-100 flex items-center space-x-2">
                      <button
                        type="button"
                        onClick={() => onApprove(item.id, 'Approved against claims sheet v2.3 and voice charter.')}

                        <CheckIcon className="w-3 h-3 text-emerald-400" />
                        <span>Approve</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setSendBackModalItem(item);
                          setSendBackComment('');
                          setSendBackError('');

                        className="flex-1 py-1.5 px-2 rounded text-[11px] font-medium text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200/70 transition-colors"
                      >
                        Send Back
                      </button>
                    </div>
                  )}
                </div>
              );
            })
          )}
        </div>

        {/* Column 2: Approved */}
        <div className="bg-slate-100/50 rounded-lg p-3 border border-slate-200/80 space-y-3">
          <div className="flex items-center justify-between pb-2 border-b border-slate-200/70 text-xs">
            <div className="flex items-center space-x-2">
              <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span className="font-semibold text-slate-800">Approved Release</span>
            </div>
            <span className="text-[10px] font-mono font-semibold bg-white text-slate-700 px-1.5 py-0.2 rounded border border-slate-200">
              {approvedItems.length}
            </span>
          </div>

          {approvedItems.length === 0 ? (
            <div className="p-6 text-center text-xs text-slate-400 bg-white/60 rounded border border-dashed border-slate-200">
              No approved items yet.
            </div>
          ) : (
            approvedItems.map((item) => (
              <div key={item.id} className="bg-white rounded-md border border-emerald-200/80 p-3 shadow-xs space-y-2 text-xs relative">
                <div className="flex items-center justify-between text-[11px]">
                  <span className="font-medium bg-emerald-50 text-emerald-800 px-2 py-0.5 rounded border border-emerald-200/50">
                    {item.contentType}
                  </span>
                  <span className="font-mono text-emerald-700 text-[10px]">
                    Passed ✓
                  </span>
                </div>

                <p className="text-slate-800 line-clamp-3 leading-relaxed bg-slate-50/70 p-2 rounded border border-slate-100 font-sans">
                  "{item.text}"
                </p>

                <div className="pt-1 text-[11px] text-slate-400 font-mono flex items-center justify-between">
                  <span>Approved: {item.approvedAt || 'Earlier'}</span>
                </div>
              </div>
            ))
          )}
        </div>

        {/* Column 3: Sent Back */}
        <div className="bg-slate-100/50 rounded-lg p-3 border border-slate-200/80 space-y-3">
          <div className="flex items-center justify-between pb-2 border-b border-slate-200/70 text-xs">
            <div className="flex items-center space-x-2">
              <span className="w-2 h-2 rounded-full bg-rose-500"></span>
              <span className="font-semibold text-slate-800">Sent Back</span>
            </div>

            <div className="p-6 text-center text-xs text-slate-400 bg-white/60 rounded border border-dashed border-slate-200">
              No drafts currently returned.
            </div>

            sentBackItems.map((item) => (
              <div key={item.id} className="bg-white rounded-md border border-rose-200/80 p-3 shadow-xs space-y-2.5 text-xs">
                <div className="flex items-center justify-between text-[11px]">
                  <span className="font-medium bg-rose-50 text-rose-800 px-2 py-0.5 rounded border border-rose-200/50">
                    {item.contentType}
                  </span>
                  <span className="font-mono text-rose-700 text-[10px]">Needs Revision</span>
                </div>

                <p className="text-slate-800 line-clamp-3 leading-relaxed bg-slate-50/70 p-2 rounded border border-slate-100 font-sans">
                  "{item.text}"
                </p>

                <div className="p-2 rounded bg-rose-50/80 border border-rose-200/60 text-[11px] text-rose-900">
                  <span className="font-semibold block text-rose-800">Reviewer Note:</span>
                  <p className="italic mt-0.5">"{item.reviewerComment || 'Please revise.'}"</p>
                </div>

                <div className="pt-1 flex items-center justify-end">
                  <button
                    type="button"
                    onClick={() => onEditInWorkspace(item.id)}

                    <span>Reopen in Workspace ↩</span>

                </div>

      {/* Reviewer Feedback Modal */}
      {sendBackModalItem && (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 animate-fadeIn">

                type="button"
                onClick={() => setSendBackModalItem(null)}

                <XIcon className="w-4 h-4" />
              </button>
            </div>

            <div className="text-xs bg-slate-50 p-2.5 rounded border border-slate-200/80 text-slate-700">
              <span className="font-medium text-slate-500 block mb-1">Snippet:</span>
              <p className="line-clamp-2">"{sendBackModalItem.text}"</p>

            <div>
              <label className="block text-xs font-semibold text-slate-700 mb-1">
