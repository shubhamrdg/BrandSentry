  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  <!-- React & ReactDOM CDN -->

  <!-- Pure Detection Engine (Vanilla JS, inline for 100% file:// compatibility) -->
  <script>
    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function reviewContent(text, glossary = [], claims = [], voiceRules = []) {
      const issues = [];
      if (!text || typeof text !== 'string') return issues;

      // 1. Unsupported claim (High)
      const claimRegex = /\b\d{1,3}x\b|\b100%\b|#1\b|\bguaranteed\b/i;
      const claimMatch = text.match(claimRegex);
      if (claimMatch) {
        const claimRef = claims[0] || {
          text: "Up to 35% faster in batch-processing tests",
          source: "Claims Sheet v2.3, section 4"
        };
        issues.push({
          id: `issue-claim-${Date.now()}-1`,
          type: 'Unsupported claim',
          severity: 'High',
          snippet: claimMatch[0],
          reason: `Unsupported performance claim detected: "${claimMatch[0]}". Cites: "${claimRef.text}" (${claimRef.source}).`,
          sourceRef: claimRef.source,
          suggestedRewrite: `${claimRef.text} based on our internal benchmark.`,
          status: 'open'
        });
      }

      // 2. Tone mismatch (Medium)
      const slangWords = ["yo", "dope", "gonna", "lol", "omg", "lit"];
      const slangRegex = new RegExp(`\\b(${slangWords.join('|')})\\b`, 'i');
      const exclRegex = /!{2,}/;
      const hasSlang = slangRegex.test(text);
      const hasExcl = exclRegex.test(text);

      if (hasSlang || hasExcl) {
        const voiceRule = voiceRules[0] || { text: "Confident and friendly, never slang-heavy" };
        const matchedSnippets = [];
        const slangMatches = text.match(new RegExp(`\\b(${slangWords.join('|')})\\b`, 'gi'));
        if (slangMatches) matchedSnippets.push(...slangMatches);
        const exclMatches = text.match(/!{2,}/g);
        if (exclMatches) matchedSnippets.push(...exclMatches);

        let neutralizedText = text;
        neutralizedText = neutralizedText.replace(/!{2,}/g, '.');
        const slangMap = { yo: '', dope: 'great', gonna: 'going to', lol: '', omg: '', lit: 'impressive' };
        for (const slang of slangWords) {
          const reg = new RegExp(`\\b${slang}\\b[!,]?\\s*`, 'gi');
          neutralizedText = neutralizedText.replace(reg, (match) => {
            const rep = slangMap[slang.toLowerCase()];
            return rep ? rep + ' ' : '';
          });
        }
        neutralizedText = neutralizedText.trim();
        if (neutralizedText.length > 0) {
          neutralizedText = neutralizedText.charAt(0).toUpperCase() + neutralizedText.slice(1);
        }

        issues.push({
          id: `issue-tone-${Date.now()}-2`,
          type: 'Tone mismatch',
          severity: 'Medium',
          snippet: matchedSnippets.join(', '),
          reason: `Tone violates voice rule: "${voiceRule.text}"`,
          sourceRef: voiceRule.text,
          suggestedRewrite: neutralizedText,
          status: 'open'
        });
      }

      // 3. Terminology inconsistency (Low)
      if (Array.isArray(glossary)) {
        let termIdx = 0;
        for (const item of glossary) {
          if (!item.avoidTerm) continue;
          const termRegex = new RegExp(`\\b${escapeRegExp(item.avoidTerm)}\\b`, 'i');
          const termMatch = text.match(termRegex);
          if (termMatch) {
            const swapRegex = new RegExp(`\\b${escapeRegExp(item.avoidTerm)}\\b`, 'gi');
            const termRewrite = text.replace(swapRegex, item.approvedTerm);
            issues.push({
              id: `issue-term-${Date.now()}-${termIdx++}`,
              type: 'Terminology inconsistency',
              severity: 'Low',
              snippet: termMatch[0],
              reason: `Found unapproved term "${item.avoidTerm}". Use approved term "${item.approvedTerm}".`,
              sourceRef: `Glossary: ${item.avoidTerm} -> ${item.approvedTerm}`,
              suggestedRewrite: termRewrite,
              status: 'open'
            });
          }
        }
      }

      return issues;
    }

    if (typeof window !== 'undefined') {
      window.escapeRegExp = escapeRegExp;
      window.reviewContent = reviewContent;
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <!-- React Mount Point -->
  <div id="root"></div>

  <!-- Inline Babel Script: Guarantees immediate zero-CORS execution on file:// and http:// -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- In-Memory Seed Data ---
    const INITIAL_GLOSSARY = [
      { id: 'g1', avoidTerm: "Sign-Up Portal", approvedTerm: "Onboarding Portal" },
      { id: 'g2', avoidTerm: "Customers", approvedTerm: "Members" }
    ];

    const INITIAL_CLAIMS = [
      { id: 'c1', text: "Up to 35% faster in batch-processing tests", source: "Claims Sheet v2.3, section 4" }
    ];

    const INITIAL_VOICE_RULES = [
      { id: 'v1', text: "Confident and friendly, never slang-heavy" }
    ];

    // --- Seed Session Issues (Live Issue Tracking Across Session) ---
    const INITIAL_SESSION_ISSUES = [
      { id: 'iss-seed-1', type: 'Terminology inconsistency', severity: 'Low', snippet: 'Sign-Up Portal', status: 'resolved', detectedAt: '10:30 AM', contentType: 'Email' },
      { id: 'iss-seed-2', type: 'Unsupported claim', severity: 'High', snippet: '10x', status: 'resolved', detectedAt: '10:30 AM', contentType: 'Email' },
      { id: 'iss-seed-3', type: 'Tone mismatch', severity: 'Medium', snippet: 'Yo!!', status: 'resolved', detectedAt: '10:30 AM', contentType: 'Email' },
      { id: 'iss-seed-4', type: 'Terminology inconsistency', severity: 'Low', snippet: 'Customers', status: 'resolved', detectedAt: '03:45 PM', contentType: 'Web Page' }
    ];

    // --- Icons ---
    const ShieldCheckIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
    );

    const FileTextIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
    );

    const CheckSquareIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
      </svg>
    );

    const BookOpenIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
      </svg>
    );

    const ChartBarIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
    );

    // --- Status Badge Component ---
    function StatusBadge({ status }) {
      const configs = {
        draft: { label: 'Draft', class: 'bg-slate-100 text-slate-700 border-slate-300' },
        in_review: { label: 'In Review', class: 'bg-blue-100 text-blue-800 border-blue-300' },
        pending_approval: { label: 'Pending Approval', class: 'bg-amber-100 text-amber-800 border-amber-300' },
        approved: { label: 'Approved ✓', class: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
        sent_back: { label: 'Sent Back ↩', class: 'bg-rose-100 text-rose-800 border-rose-300' }
      };
      const config = configs[status] || configs.draft;
      return (
        <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border ${config.class}`}>
          {config.label}
        </span>
      );
    }

    // --- Review Workspace View ---
    function ReviewWorkspaceView({
      activeItem,
      onUpdateDraft,
      onReviewContent,
      onAcceptIssue,
      onEditIssue,
      onDismissIssue,
      onSendForReview
    }) {
      const TEST_EXAMPLE = "Yo! Our product is 10x faster than any competitor, and new users can get started right away on the Sign-Up Portal!!";

      const [editingIssueId, setEditingIssueId] = useState(null);
      const [editValue, setEditValue] = useState('');

      const [dismissingIssueId, setDismissingIssueId] = useState(null);
      const [dismissComment, setDismissComment] = useState('');
      const [dismissError, setDismissError] = useState('');

      const hasIssues = activeItem.issues && activeItem.issues.length > 0;
      const openIssues = (activeItem.issues || []).filter(i => i.status === 'open');
      const openIssuesCount = openIssues.length;
      
      const isSendEnabled = (activeItem.status === 'in_review' || activeItem.status === 'sent_back') &&
        activeItem.issues &&
        activeItem.issues.length > 0 &&
        openIssuesCount === 0;

      const handleTryExample = () => {
        onUpdateDraft({
          text: TEST_EXAMPLE,
          status: 'draft',
          issues: [],
          reviewerComment: ''
        });
      };

      const handleTryTweakedExample = () => {
        onUpdateDraft({
          text: "Yo! Our product is 10x faster than any competitor, and new users can get started right away on the Sign-Up Portal!! Plus, our cheap setup is guaranteed.",
          status: 'draft',
          issues: [],
          reviewerComment: ''
        });
      };

      const startEdit = (issue) => {
        setEditingIssueId(issue.id);
        setEditValue(issue.suggestedRewrite);
      };

      const confirmEdit = (issue) => {
        if (!editValue.trim()) return;
        onEditIssue(issue, editValue.trim());
        setEditingIssueId(null);
        setEditValue('');
      };

      const startDismiss = (issue) => {
        setDismissingIssueId(issue.id);
        setDismissComment('');
        setDismissError('');
      };

      const confirmDismiss = (issue) => {
        if (!dismissComment.trim()) {
          setDismissError('A one-line comment is strictly required to dismiss this issue.');
          return;
        }
        onDismissIssue(issue, dismissComment.trim());
        setDismissingIssueId(null);
        setDismissComment('');
        setDismissError('');
      };

      return (
        <div className="space-y-6 max-w-6xl mx-auto animate-fadeIn">
          {activeItem.status === 'sent_back' && (
            <div className="bg-rose-50 border-l-4 border-rose-500 rounded-r-xl p-4 shadow-sm flex items-start space-x-3">
              <div className="text-rose-500 flex-shrink-0 pt-0.5">
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
              </div>
              <div className="flex-1">
                <h4 className="text-xs font-bold text-rose-900 uppercase tracking-wider">
                  Content Sent Back by Reviewer
                </h4>
                <p className="text-xs text-rose-700 mt-1 font-medium">
                  Reviewer note: "{activeItem.reviewerComment || 'Please revise violations and resubmit.'}"
                </p>
                <p className="text-[11px] text-rose-600 mt-0.5">
                  Edit the copy below and click <strong>"Review Content"</strong> to re-enter review.
                </p>
              </div>
            </div>
          )}

          <div className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-5 border-b border-slate-100">
              <div>
                <div className="flex items-center space-x-3">
                  <h2 className="text-xl font-bold text-slate-900">Review Workspace</h2>
                  <StatusBadge status={activeItem.status} />
                </div>
                <p className="text-sm text-slate-500 mt-1">
                  Draft, inspect, and resolve brand governance checks across claims, tone, and terminology.
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-2 self-start md:self-auto">
                <button
                  type="button"
                  onClick={handleTryExample}
                  className="px-3.5 py-2 text-xs font-semibold rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors border border-slate-300 shadow-sm flex items-center space-x-1.5"
                >
                  <svg className="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
                  </svg>
                  <span>Try an Example</span>
                </button>
                <button
                  type="button"
                  onClick={handleTryTweakedExample}
                  className="px-3.5 py-2 text-xs font-semibold rounded-lg bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition-colors border border-indigo-200 shadow-sm flex items-center space-x-1.5"
                  title="Loads copy with words like 'competitor', 'users', 'cheap' to test new glossary additions"
                >
                  <svg className="w-4 h-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                  </svg>
                  <span>Try Tweaked Example</span>
                </button>
              </div>
            </div>

            <div className="mt-5 space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center space-x-2">
                  <label htmlFor="contentType" className="text-xs font-semibold text-slate-600 uppercase tracking-wider">
                    Content Type:
                  </label>
                  <select
                    id="contentType"
                    value={activeItem.contentType}
                    onChange={(e) => onUpdateDraft({ contentType: e.target.value })}
                    className="text-xs font-medium bg-slate-50 border border-slate-300 text-slate-700 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  >
                    <option value="Email">Email Campaign</option>
                    <option value="Web Page">Web Page / Landing</option>
                    <option value="Social Post">Social Post</option>
                  </select>
                </div>

                <div className="text-xs text-slate-400">
                  {activeItem.text.length} characters • {activeItem.text.trim() ? activeItem.text.trim().split(/\s+/).length : 0} words
                </div>
              </div>

              <div>
                <textarea
                  rows={4}
                  value={activeItem.text}
                  onChange={(e) => onUpdateDraft({ text: e.target.value })}
                  placeholder="Paste marketing copy, product announcements, or click 'Try an Example' to test brand governance..."
                  className="w-full rounded-lg border border-slate-300 p-4 text-sm text-slate-800 placeholder-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none transition-all shadow-inner font-normal leading-relaxed"
                />
              </div>

              <div className="flex items-center justify-between pt-1">
                <div className="text-xs text-slate-500">
                  {activeItem.status === 'sent_back' ? (
                    <span className="text-amber-700 font-medium">Click "Review Content" to move back to in_review</span>
                  ) : (
                    <span>Current state: <strong>{activeItem.status}</strong></span>
                  )}
                </div>

                <button
                  type="button"
                  onClick={onReviewContent}
                  disabled={!activeItem.text.trim()}
                  className={`px-5 py-2.5 rounded-lg text-sm font-semibold transition-all shadow-sm flex items-center space-x-2 ${
                    activeItem.text.trim()
                      ? 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-200'
                      : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                  }`}
                >
                  <FileTextIcon className="w-4 h-4" />
                  <span>{activeItem.status === 'sent_back' ? 'Resubmit & Review' : 'Review Content'}</span>
                </button>
              </div>
            </div>
          </div>

          {activeItem.status !== 'draft' && (
            <div className="space-y-6">
              {hasIssues && openIssuesCount === 0 && activeItem.status !== 'pending_approval' && activeItem.status !== 'approved' && (
                <div className="bg-emerald-50 border-2 border-emerald-400 rounded-xl p-5 shadow-sm animate-fadeIn">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                      <div className="bg-emerald-500 text-white rounded-full p-2 flex-shrink-0">
                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />
                        </svg>
                      </div>
                      <div>
                        <h3 className="text-base font-bold text-emerald-900">
                          Ready for approval
                        </h3>
                        <p className="text-xs text-emerald-700 mt-0.5">
                          All {activeItem.issues.length} detected issues have been addressed. You can now transition this item to pending_approval.
                        </p>
                      </div>
                    </div>

                    <button
                      type="button"
                      onClick={onSendForReview}
                      disabled={!isSendEnabled}
                      className="px-6 py-2.5 rounded-lg text-sm font-bold shadow-md transition-all flex items-center justify-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white hover:shadow-lg"
                    >
                      <CheckSquareIcon className="w-4 h-4" />
                      <span>Send for Review</span>
                    </button>
                  </div>
                </div>
              )}

              {activeItem.status === 'pending_approval' && (
                <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-5 shadow-sm">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center space-x-3">
                      <div className="bg-amber-500 text-white rounded-full p-2">
                        <CheckSquareIcon className="w-5 h-5" />
                      </div>
                      <div>
                        <h3 className="text-base font-bold text-amber-900">
                          Item is Pending Approval

                        <p className="text-xs text-amber-700 mt-0.5">
                          Submitted at {activeItem.submittedAt || 'recently'}. Available in the Approval Board for review and sign-off.
                        </p>
                      </div>
                    </div>
                    <StatusBadge status={activeItem.status} />
                  </div>
                </div>
              )}

              <div className="flex items-center justify-between">
                <div>
                  <h3 className="text-base font-bold text-slate-900">
                    Governance Inspection Report ({activeItem.issues?.length || 0} Issues)

                  <p className="text-xs text-slate-500 mt-0.5">
                    {openIssuesCount > 0
                      ? `${openIssuesCount} open issue(s) remaining. Resolve each issue to enable "Send for Review".`
                      : 'All governance issues are resolved.'}
                  </p>
                </div>

                {openIssuesCount > 0 && (
                  <button
                    type="button"
                    disabled
                    title="Resolve all open issues to unlock Send for Review"
                    className="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-200 text-slate-400 cursor-not-allowed flex items-center space-x-1.5 border border-slate-300"
                  >
                    <CheckSquareIcon className="w-4 h-4 text-slate-400" />
                    <span>Send for Review (Locked: {openIssuesCount} open)</span>
                  </button>
                )}
              </div>

    // --- Knowledge Base View ---
    function KnowledgeBaseView({
      glossary = [],
      claims = [],
      voiceRules = [],
      onAddGlossaryPair,
      onDeleteGlossaryPair
    }) {
      const [avoidTerm, setAvoidTerm] = useState('');
      const [approvedTerm, setApprovedTerm] = useState('');
      const [feedbackMsg, setFeedbackMsg] = useState(null);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!avoidTerm.trim() || !approvedTerm.trim()) return;

        onAddGlossaryPair(avoidTerm.trim(), approvedTerm.trim());
        const addedPair = { avoid: avoidTerm.trim(), approved: approvedTerm.trim() };
        setAvoidTerm('');
        setApprovedTerm('');
        setFeedbackMsg(`Successfully added "${addedPair.avoid}" → "${addedPair.approved}". It is now actively detected in the Review Workspace!`);
        setTimeout(() => setFeedbackMsg(null), 6000);
      };

      const handleQuickAdd = (avoid, approved) => {
        onAddGlossaryPair(avoid, approved);
        setFeedbackMsg(`Added test rule: "${avoid}" → "${approved}". Go to Review Workspace to test!`);

                    Claim ({claimCount})
                  </button>
                  <button
                    type="button"
                    onClick={() => setSelectedFilter('tone')}
                    className={`px-2.5 py-1 rounded text-xs font-semibold transition-all ${
                      selectedFilter === 'tone'
                        ? 'bg-amber-500 text-white shadow-sm'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    Tone ({toneCount})
                  </button>
                  <button
                    type="button"
                    onClick={() => setSelectedFilter('terminology')}
                    className={`px-2.5 py-1 rounded text-xs font-semibold transition-all ${
                      selectedFilter === 'terminology'
                        ? 'bg-indigo-600 text-white shadow-sm'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    Terminology ({termCount})
                  </button>
                </div>
              </div>

              <div className="overflow-x-auto border border-slate-200 rounded-xl">
                <table className="w-full text-left text-xs text-slate-700">
                  <thead className="bg-slate-50 text-[11px] font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">
                    <tr>
                      <th className="py-2.5 px-3">Time</th>
                      <th className="py-2.5 px-3">Category / Type</th>
                      <th className="py-2.5 px-3">Severity</th>
                      <th className="py-2.5 px-3">Matched Snippet</th>
                      <th className="py-2.5 px-3">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 bg-white">
                    {displayedIssues.length === 0 ? (
                      <tr>
                        <td colSpan={5} className="py-6 text-center text-slate-400 italic">
                          No issues match the selected category.
                        </td>
                      </tr>
                    ) : (
                      displayedIssues.slice(-8).reverse().map((issue, idx) => {
                        const severityClass = {
                          High: 'bg-rose-100 text-rose-800 border-rose-200',
                          Medium: 'bg-amber-100 text-amber-800 border-amber-200',
                          Low: 'bg-indigo-100 text-indigo-800 border-indigo-200'
                        }[issue.severity] || 'bg-slate-100 text-slate-700 border-slate-200';

                        return (
                          <tr key={`${issue.id}-${idx}`} className="hover:bg-slate-50/80 transition-colors">
                            <td className="py-2 px-3 text-slate-400 font-mono text-[11px]">
                              {issue.detectedAt || 'Session'}
                            </td>
                            <td className="py-2 px-3 font-semibold text-slate-800">
                              {issue.type}
                            </td>
                            <td className="py-2 px-3">
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded border uppercase tracking-wider ${severityClass}`}>
                                {issue.severity}
                              </span>
                            </td>
                            <td className="py-2 px-3 font-mono text-rose-700 bg-rose-50/50 px-2 py-0.5 rounded">
                              "{issue.snippet}"
                            </td>
                            <td className="py-2 px-3">
                              {issue.status === 'resolved' ? (
                                <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-200">
                                  Resolved ✓
                                </span>
                              ) : (
                                <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-200">
                                  Open ⏳
                                </span>
                              )}
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Pipeline & State Machine Footnote */}
            <div className="mt-8 pt-6 border-t border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs">
                <span className="font-bold text-slate-800 block mb-1">Session Pipeline Activity:</span>
                <div className="flex items-center space-x-4 text-slate-600 mt-2">
                  <span>Total Items: <strong>{totalItems}</strong></span>
                  <span>In Review: <strong>{inReviewItems}</strong></span>
                  <span>Pending: <strong>{pendingItems}</strong></span>
                  <span>Approved: <strong>{approvedItems}</strong></span>
                </div>
              </div>

              <div className="bg-slate-900 text-slate-300 p-4 rounded-xl text-xs font-mono leading-relaxed">
                <span className="text-emerald-400 font-bold block mb-1">State Machine Flow:</span>
                draft → in_review → pending_approval → approved<br/>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ sent_back → (re-review)
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Main Application Shell ---
    function BrandSentryApp() {
      const [activeTab, setActiveTab] = useState('review');

      // Seed Knowledge Base data
      const [glossary, setGlossary] = useState(INITIAL_GLOSSARY);
      const [claims, setClaims] = useState(INITIAL_CLAIMS);
      const [voiceRules, setVoiceRules] = useState(INITIAL_VOICE_RULES);

      // Live session-level issue tracking for Insights across all reviews
      const [sessionIssues, setSessionIssues] = useState(INITIAL_SESSION_ISSUES);

      // App-level ContentItem repository with preloaded seed items
      const [contentItems, setContentItems] = useState([
        {
          id: 'ci-init-1',
          text: '',
          contentType: 'Email',
          submittedAt: null,
          approvedAt: null,
          issues: [],
          status: 'draft',
          reviewerComment: ''
        },
        {
          id: 'ci-preload-pending',
          text: "Welcome to our Onboarding Portal! Our enterprise cloud engine is up to 35% faster in batch-processing tests based on our internal benchmark. Explore all dedicated tools built for our Members.",
          contentType: 'Email',
          submittedAt: 'Today, 10:30 AM',
          approvedAt: null,
          issues: [
            { id: 'iss-seed-1', type: 'Terminology inconsistency', severity: 'Low', snippet: 'Sign-Up Portal', status: 'resolved', resolution: 'Replaced with "Onboarding Portal"' },
            { id: 'iss-seed-2', type: 'Unsupported claim', severity: 'High', snippet: '10x', status: 'resolved', resolution: 'Capped to approved internal benchmark' },
            { id: 'iss-seed-3', type: 'Tone mismatch', severity: 'Medium', snippet: 'Yo!!', status: 'resolved', resolution: 'Neutralized tone to professional & friendly' }
          ],
          status: 'pending_approval',
          reviewerComment: ''
        },
        {
          id: 'ci-preload-approved',
          text: "Announcing the Q3 Release for all Members: experience secure, automated compliance checks directly within the Onboarding Portal.",
          contentType: 'Web Page',
          submittedAt: 'Yesterday, 03:45 PM',
          approvedAt: 'Yesterday, 04:30 PM',
          issues: [
            { id: 'iss-seed-4', type: 'Terminology inconsistency', severity: 'Low', snippet: 'Customers', status: 'resolved', resolution: 'Replaced with "Members"' }
          ],
          status: 'approved',
          reviewerComment: 'Verified against Voice and Claims sheet v2.3. Ready for publishing.'
        }
      ]);
      const [activeItemId, setActiveItemId] = useState('ci-init-1');

      const currentItem = contentItems.find(i => i.id === activeItemId) || contentItems[0];

      const updateActiveItem = (patch) => {
        setContentItems(prev => prev.map(item => item.id === currentItem.id ? { ...item, ...patch } : item));
      };

      // State Transition: "Review Content" -> status: in_review
      const handleReviewContent = () => {
        if (!currentItem.text.trim()) return;
        const detectedIssues = window.reviewContent(currentItem.text, glossary, claims, voiceRules);
        updateActiveItem({
          issues: detectedIssues,
          status: 'in_review'
        });

        // Automatically push newly detected issues into the live session pool for Insights
        if (detectedIssues.length > 0) {
          const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          const issuesWithMeta = detectedIssues.map(iss => ({
            ...iss,
            detectedAt: timestamp,
            contentType: currentItem.contentType
          }));
          setSessionIssues(prev => [...prev, ...issuesWithMeta]);
        }
      };

      // Accept issue suggestion
      const handleAcceptIssue = (issue) => {
        let updatedText = currentItem.text;

        if (issue.type === 'Terminology inconsistency') {
          const matchedGlossary = glossary.find(g => g.avoidTerm.toLowerCase() === issue.snippet.toLowerCase());
          const rep = matchedGlossary ? matchedGlossary.approvedTerm : issue.suggestedRewrite;
          const reg = new RegExp(`\\b${window.escapeRegExp(issue.snippet)}\\b`, 'gi');
          updatedText = updatedText.replace(reg, rep);
        } else if (issue.type === 'Unsupported claim') {
          const reg = new RegExp(`\\b${window.escapeRegExp(issue.snippet)}\\b`, 'i');
          updatedText = updatedText.replace(reg, issue.suggestedRewrite);
        } else if (issue.type === 'Tone mismatch') {
          updatedText = updatedText.replace(/!{2,}/g, '.');
          const slangWords = ["yo", "dope", "gonna", "lol", "omg", "lit"];
          for (const slang of slangWords) {
            const reg = new RegExp(`\\b${slang}\\b[!,]?\\s*`, 'gi');
            updatedText = updatedText.replace(reg, '');
          }
          updatedText = updatedText.trim();
          if (updatedText.length > 0) {
            updatedText = updatedText.charAt(0).toUpperCase() + updatedText.slice(1);
          }
        }

        const updatedIssues = currentItem.issues.map(iss =>
          iss.id === issue.id
            ? { ...iss, status: 'resolved', resolution: 'Accepted suggested rewrite' }
            : iss
        );

        updateActiveItem({
          text: updatedText,
          issues: updatedIssues
        });

        // Update status in session issues log
        setSessionIssues(prev => prev.map(iss =>
          iss.id === issue.id ? { ...iss, status: 'resolved' } : iss
        ));
      };

      // Custom edit issue
      const handleEditIssue = (issue, customReplacement) => {
        let updatedText = currentItem.text;
        const reg = new RegExp(window.escapeRegExp(issue.snippet), 'i');
        if (reg.test(updatedText)) {
          updatedText = updatedText.replace(reg, customReplacement);
        } else {
          updatedText = customReplacement;
        }

        const updatedIssues = currentItem.issues.map(iss =>
          iss.id === issue.id
            ? { ...iss, status: 'resolved', resolution: `Custom replacement: "${customReplacement}"` }
            : iss
        );

        updateActiveItem({
          text: updatedText,
          issues: updatedIssues
        });

        // Update status in session issues log
        setSessionIssues(prev => prev.map(iss =>
          iss.id === issue.id ? { ...iss, status: 'resolved' } : iss
        ));
      };

      // Dismiss issue with comment
      const handleDismissIssue = (issue, comment) => {
        const updatedIssues = currentItem.issues.map(iss =>
          iss.id === issue.id
            ? { ...iss, status: 'resolved', resolution: `Dismissed with comment: "${comment}"` }
            : iss
        );

        updateActiveItem({
          issues: updatedIssues
        });

        // Update status in session issues log
        setSessionIssues(prev => prev.map(iss =>
          iss.id === issue.id ? { ...iss, status: 'resolved' } : iss
        ));
      };

      // State Transition: "Send for Review" -> status: pending_approval
      const handleSendForReview = () => {
        const openCount = (currentItem.issues || []).filter(i => i.status === 'open').length;
        if (openCount > 0) return;

        updateActiveItem({
          status: 'pending_approval',
          submittedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
      };

      // State Transition: Approval Board -> status: approved
      const handleApproveItem = (id, comment) => {
        const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        setContentItems(prev => prev.map(item =>
          item.id === id ? { ...item, status: 'approved', approvedAt: timestamp, reviewerComment: comment } : item
        ));
      };

      // State Transition: Approval Board -> status: sent_back
      const handleSendBackItem = (id, comment) => {
        setContentItems(prev => prev.map(item =>
          item.id === id ? { ...item, status: 'sent_back', reviewerComment: comment } : item
        ));
      };

      // Switch to workspace to edit an item
      const handleEditInWorkspace = (id) => {
        setActiveItemId(id);
        setActiveTab('review');
      };

      // Add new glossary pair in-memory (propagates immediately to reviewContent)
      const handleAddGlossaryPair = (avoidTerm, approvedTerm) => {
        if (!avoidTerm.trim() || !approvedTerm.trim()) return;
        const newPair = {
          id: `g${Date.now()}`,
          avoidTerm: avoidTerm.trim(),
          approvedTerm: approvedTerm.trim()
        };
        setGlossary(prev => [...prev, newPair]);
      };

      // Remove glossary pair
      const handleDeleteGlossaryPair = (id) => {
        setGlossary(prev => prev.filter(item => item.id !== id));
      };

      const pendingCount = contentItems.filter(i => i.status === 'pending_approval').length;

      const navItems = [
        { id: 'review', label: 'Review Workspace', icon: FileTextIcon },
        { id: 'approval', label: 'Approval Board', icon: CheckSquareIcon, badge: pendingCount > 0 ? pendingCount : undefined },
        { id: 'knowledge', label: 'Knowledge Base', icon: BookOpenIcon, badge: glossary.length + claims.length + voiceRules.length },
        { id: 'insights', label: 'Insights', icon: ChartBarIcon, badge: sessionIssues.length }
      ];

      return (
        <div className="flex h-screen bg-slate-50 overflow-hidden font-sans">
          {/* Left Sidebar */}
          <aside className="w-64 bg-slate-900 text-slate-200 flex flex-col flex-shrink-0 shadow-xl border-r border-slate-800">
            <div className="p-5 border-b border-slate-800 flex items-center space-x-3">
              <div className="bg-indigo-600 p-2 rounded-lg text-white shadow-md">
                <ShieldCheckIcon className="w-6 h-6" />
              </div>
              <div>
                <h1 className="text-lg font-bold tracking-tight text-white leading-tight">
                  BrandSentry
                </h1>
                <span className="inline-block text-[11px] font-semibold text-indigo-400 uppercase tracking-wider">
                  by DviCoders
                </span>
              </div>
            </div>

            <nav className="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
              <div className="px-3 pb-2 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                Governance Platform
              </div>
              {navItems.map((item) => {
                const Icon = item.icon;
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition-all ${
                      isActive
                        ? 'bg-indigo-600 text-white shadow-sm'
                        : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    <div className="flex items-center space-x-3">
                      <Icon className={`w-5 h-5 ${isActive ? 'text-white' : 'text-slate-400'}`} />
                      <span>{item.label}</span>
                    </div>
                    {item.badge !== undefined && (
                      <span className={`text-[11px] px-2 py-0.5 rounded-full font-semibold ${
                        isActive ? 'bg-indigo-700 text-white' : 'bg-slate-800 text-slate-300'
                      }`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </nav>

            <div className="p-4 border-t border-slate-800">
              <div className="bg-slate-800/80 rounded-lg p-3 text-xs border border-slate-700">
                <div className="flex items-center space-x-2 text-emerald-400 mb-1 font-medium">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>In-Memory State Machine</span>
                </div>
                <p className="text-slate-400 text-[11px]">
                  No backend • Pure client-side state
                </p>
              </div>
            </div>
          </aside>

          {/* Main Content Area */}
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
            {/* Top Navbar */}
            <header className="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between flex-shrink-0 shadow-sm">
              <div className="flex items-center space-x-2">
                <span className="text-slate-400 text-sm">BrandSentry</span>
                <span className="text-slate-300">/</span>
                <span className="text-slate-800 font-semibold text-sm">
                  {navItems.find((n) => n.id === activeTab)?.label}
                </span>
              </div>

              <div className="hidden sm:flex items-center space-x-1 bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs font-medium">
                {navItems.map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`px-3 py-1.5 rounded-md transition-all ${
                      activeTab === item.id
                        ? 'bg-white text-indigo-700 shadow-sm font-semibold'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
              </div>

              <div className="flex items-center space-x-3">
                <span className="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200">
                  DviCoders Hackathon
                </span>
              </div>
            </header>

            {/* Dynamic View Body */}
            <main className="flex-1 overflow-y-auto p-6">
              {activeTab === 'review' && (
                <ReviewWorkspaceView
                  activeItem={currentItem}
                  onUpdateDraft={updateActiveItem}
                  onReviewContent={handleReviewContent}
                  onAcceptIssue={handleAcceptIssue}
                  onEditIssue={handleEditIssue}
                  onDismissIssue={handleDismissIssue}
                  onSendForReview={handleSendForReview}
                />
              )}
              {activeTab === 'approval' && (
                <ApprovalBoardView
                  contentItems={contentItems}
                  onApprove={handleApproveItem}
                  onSendBack={handleSendBackItem}
                  onEditInWorkspace={handleEditInWorkspace}
                />
              )}
              {activeTab === 'knowledge' && (
                <KnowledgeBaseView
                  glossary={glossary}
                  claims={claims}
                  voiceRules={voiceRules}
                  onAddGlossaryPair={handleAddGlossaryPair}
                  onDeleteGlossaryPair={handleDeleteGlossaryPair}
                />
              )}
              {activeTab === 'insights' && (
                <InsightsView
                  contentItems={contentItems}
                  sessionIssues={sessionIssues}
                  onNavigateToWorkspace={() => setActiveTab('review')}
                />
              )}
            </main>
          </div>
        </div>
      );
    }

    // Mount the React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BrandSentryApp />);
  </script>
</body>
</html>
