              </label>
              <textarea
                rows={3}
                value={sendBackComment}
                onChange={(e) => {
                  setSendBackComment(e.target.value);
                  setSendBackError('');
                }}
                placeholder="Specify required citations, guideline violations, or tone corrections..."
                className="w-full text-xs border border-slate-300 rounded p-2.5 text-slate-800 focus:outline-none focus:ring-1 focus:ring-slate-400"
              />
              {sendBackError && (
                <p className="text-[11px] text-rose-600 font-medium mt-1">{sendBackError}</p>
              )}
            </div>

            <div className="flex items-center justify-end space-x-2 pt-1">
              <button
                type="button"
                onClick={() => setSendBackModalItem(null)}
                className="px-3 py-1.5 text-xs text-slate-600 hover:text-slate-800"
              >
                Cancel
              </button>
              <button
                type="button"
                onClick={handleConfirmSendBack}
                className="px-3.5 py-1.5 text-xs font-medium bg-rose-600 hover:bg-rose-700 text-white rounded shadow-xs"
              >
                Send Back with Comment
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// --- Knowledge Base View (Governed Rules & Live Form) ---
function KnowledgeBaseView({
  glossary = [],
  claims = [],
  voiceRules = [],
  palette = [],
  onAddGlossaryPair,
  onDeleteGlossaryPair,
  onAddColor,
  onDeleteColor
}) {
  const [avoidTerm, setAvoidTerm] = useState('');
  const [approvedTerm, setApprovedTerm] = useState('');
  const [newColorName, setNewColorName] = useState('');
  const [newColorHex, setNewColorHex] = useState('#2563EB');
  const [bannerMsg, setBannerMsg] = useState(null);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!avoidTerm.trim() || !approvedTerm.trim()) return;

    onAddGlossaryPair(avoidTerm.trim(), approvedTerm.trim());
    setBannerMsg(`Added "${avoidTerm.trim()}" → "${approvedTerm.trim()}". Active immediately!`);
    setAvoidTerm('');
    setApprovedTerm('');
    setTimeout(() => setBannerMsg(null), 4500);
  };

  const handleColorSubmit = (e) => {
    e.preventDefault();
    if (!newColorName.trim() || !newColorHex.trim()) return;

    onAddColor(newColorName.trim(), newColorHex.trim());
    setBannerMsg(`Added "${newColorName.trim()}" (${newColorHex.trim().toUpperCase()}) to approved palette!`);
    setNewColorName('');
    setNewColorHex('#2563EB');
    setTimeout(() => setBannerMsg(null), 4500);
  };

  return (
    <div className="max-w-7xl mx-auto space-y-4 animate-fadeIn">
      {/* Top Banner */}
      <div className="bg-white border border-slate-200/80 rounded-lg p-3.5 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
        <div>
          <h2 className="font-semibold text-slate-900 text-sm">Governed Brand Knowledge Base</h2>
          <p className="text-slate-500 text-[11px] mt-0.5">
            Single source of truth feeding the client-side detection engine in real time.
          </p>
        </div>
        <div className="text-[11px] font-mono text-slate-500">
          {glossary.length} terminology pairs • {palette.length} palette colors • {claims.length} claims • {voiceRules.length} voice charter
        </div>
      </div>

      {bannerMsg && (
        <div className="bg-emerald-50 border border-emerald-200 rounded p-2.5 text-xs text-emerald-800 flex items-center space-x-2">
          <CheckIcon className="w-3.5 h-3.5 text-emerald-600" />
          <span>{bannerMsg}</span>
        </div>
      )}

      {/* 4 Columns for 4 Rule Categories */}
      <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 items-start">
        {/* 1. Terminology Glossary */}
        <div className="bg-white border border-slate-200/80 rounded-lg p-4 shadow-xs space-y-3.5 text-xs">
          <div className="flex items-center justify-between pb-2 border-b border-slate-100">
            <span className="font-semibold text-slate-900">Governed Terminology</span>
            <span className="text-[10px] uppercase font-mono px-1.5 py-0.2 rounded bg-sky-50 text-sky-700 border border-sky-200">
              Low Severity
            </span>
          </div>

          <p className="text-slate-500 text-[11px]">
            Standardizes product and organizational terminology across public communications.
          </p>

          <div className="space-y-2">
            {glossary.map((item) => (
              <div key={item.id} className="p-2.5 rounded border border-slate-200/70 bg-slate-50/50 flex items-center justify-between">
                <div>
                  <div className="flex items-center space-x-1.5 text-slate-700">
                    <span className="line-through text-rose-600 font-mono text-[11px]">{item.avoidTerm}</span>
                    <span className="text-slate-400">→</span>
                    <span className="font-semibold text-emerald-700 font-mono text-[11px]">{item.approvedTerm}</span>
                  </div>
                </div>
                {glossary.length > 2 && (
                  <button
                    type="button"
                    onClick={() => onDeleteGlossaryPair(item.id)}
                    className="text-slate-400 hover:text-rose-600 p-1"
                    title="Remove term"
                  >
                    <XIcon className="w-3 h-3" />
                  </button>
                )}
              </div>
            ))}
          </div>

          {/* Add Term Form */}
          <form onSubmit={handleSubmit} className="pt-2 border-t border-slate-100 space-y-2">
            <span className="font-semibold text-slate-800 text-[11px] block">Add New Terminology Pair:</span>
            <div className="grid grid-cols-2 gap-2">
              <input
                type="text"
                placeholder="Avoid (e.g. cheap)"
                value={avoidTerm}
                onChange={(e) => setAvoidTerm(e.target.value)}
                className="w-full text-xs bg-slate-50 border border-slate-200 rounded p-1.5 focus:bg-white focus:outline-none focus:ring-1 focus:ring-slate-400"
              />
              <input
                type="text"
                placeholder="Approved (e.g. affordable)"
                value={approvedTerm}
                onChange={(e) => setApprovedTerm(e.target.value)}
                className="w-full text-xs bg-slate-50 border border-slate-200 rounded p-1.5 focus:bg-white focus:outline-none focus:ring-1 focus:ring-slate-400"
              />
            </div>
            <button
              type="submit"
              disabled={!avoidTerm.trim() || !approvedTerm.trim()}
              className={`w-full py-1.5 rounded text-xs font-medium transition-colors shadow-xs ${avoidTerm.trim() && approvedTerm.trim()
                ? 'bg-slate-900 hover:bg-slate-800 text-white cursor-pointer'
                : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                }`}
            >
              + Add to Active Engine
            </button>
          </form>
        </div>

        {/* 2. Approved Brand Palette (Phase 9) */}
        <div className="bg-white border border-slate-200/80 rounded-lg p-4 shadow-xs space-y-3.5 text-xs">
          <div className="flex items-center justify-between pb-2 border-b border-slate-100">
            <span className="font-semibold text-slate-900">Approved Palette</span>
            <span className="text-[10px] uppercase font-mono px-1.5 py-0.2 rounded bg-purple-50 text-purple-700 border border-purple-200">
              Medium Severity
            </span>
          </div>

          <p className="text-slate-500 text-[11px]">
            Official brand hex colors. Visual consistency checks flag unapproved colors and recommend the nearest match.
          </p>

          <div className="space-y-2">
            {palette.map((color) => (
              <div key={color.id} className="p-2.5 rounded border border-slate-200/70 bg-slate-50/50 flex items-center justify-between">
                <div className="flex items-center space-x-2.5">
                  <span
                    className="w-5 h-5 rounded border border-slate-300 shadow-2xs shrink-0"
                    style={{ backgroundColor: color.hex }}
                  />
                  <div>
                    <span className="font-semibold text-slate-800 text-[11px] block">{color.name}</span>
                    <span className="font-mono text-slate-500 text-[10px]">{color.hex}</span>
                  </div>
                </div>
                {palette.length > 1 && (
                  <button
                    type="button"
                    onClick={() => onDeleteColor(color.id)}
                    className="text-slate-400 hover:text-rose-600 p-1"
                    title="Remove color"
                  >
                    <XIcon className="w-3 h-3" />
                  </button>
                )}
              </div>
            ))}
          </div>

          {/* Add Color Form */}
          <form onSubmit={handleColorSubmit} className="pt-2 border-t border-slate-100 space-y-2">
            <span className="font-semibold text-slate-800 text-[11px] block">Add Approved Color:</span>
            <div className="space-y-1.5">
              <input
                type="text"
                placeholder="Color Name (e.g. Electric Blue)"
                value={newColorName}
                onChange={(e) => setNewColorName(e.target.value)}
                className="w-full text-xs bg-slate-50 border border-slate-200 rounded p-1.5 focus:bg-white focus:outline-none focus:ring-1 focus:ring-slate-400"
              />
              <div className="flex items-center space-x-1.5">
                <input
                  type="color"
                  value={newColorHex || "#2563EB"}
                  onChange={(e) => setNewColorHex(e.target.value.toUpperCase())}
                  className="w-7 h-7 rounded cursor-pointer border border-slate-200 p-0 bg-transparent shrink-0"
                  title="Pick color"
                />
                <input
                  type="text"
                  placeholder="#HEX"
                  value={newColorHex}
                  onChange={(e) => setNewColorHex(e.target.value.toUpperCase())}
                  className="w-full text-xs font-mono bg-slate-50 border border-slate-200 rounded p-1.5 focus:bg-white focus:outline-none focus:ring-1 focus:ring-slate-400"
                />
              </div>
            </div>
            <button
              type="submit"
              disabled={!newColorName.trim() || !newColorHex.trim()}
              className={`w-full py-1.5 rounded text-xs font-medium transition-colors shadow-xs ${newColorName.trim() && newColorHex.trim()
                ? 'bg-slate-900 hover:bg-slate-800 text-white cursor-pointer'
                : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                }`}
            >
              + Add to Palette
            </button>
          </form>
        </div>

        {/* 3. Approved Claims */}
        <div className="bg-white border border-slate-200/80 rounded-lg p-4 shadow-xs space-y-3.5 text-xs">
          <div className="flex items-center justify-between pb-2 border-b border-slate-100">
            <span className="font-semibold text-slate-900">Approved Metric Claims</span>
            <span className="text-[10px] uppercase font-mono px-1.5 py-0.2 rounded bg-rose-50 text-rose-700 border border-rose-200">
              High Severity
            </span>
          </div>

          <p className="text-slate-500 text-[11px]">
            Verified metric citations required when copy mentions speed boasts, percentages, or guarantees.
          </p>

          <div className="space-y-2.5">
            {claims.map((claim) => (
              <div key={claim.id} className="p-3 rounded border border-slate-200/70 bg-slate-50/50 space-y-1.5">
                <p className="text-slate-800 font-medium leading-relaxed font-sans">
                  "{claim.text}"
                </p>
                <div className="flex items-center justify-between text-[10px] pt-1 border-t border-slate-200/60 font-mono text-slate-500">

                  <span>Source Citation:</span>
                  <span className="text-slate-700 font-medium">{claim.source}</span>
                </div>
              </div>
            ))}
          </div>

          <div className="p-2.5 rounded bg-slate-50 border border-slate-200/60 text-[11px] text-slate-600 leading-relaxed font-sans">
            <strong>Detection Regex:</strong> Matches unbacked numbers like <code>10x</code>, <code>100%</code>, <code>#1</code>, or <code>guaranteed</code>.
          </div>
        </div>

        {/* 4. Brand Voice Rules */}
        <div className="bg-white border border-slate-200/80 rounded-lg p-4 shadow-xs space-y-3.5 text-xs">
          <div className="flex items-center justify-between pb-2 border-b border-slate-100">
            <span className="font-semibold text-slate-900">Brand Voice Charter</span>
            <span className="text-[10px] uppercase font-mono px-1.5 py-0.2 rounded bg-amber-50 text-amber-700 border border-amber-200">
              Medium Severity
            </span>
          </div>

          <p className="text-slate-500 text-[11px]">
            Voice rules ensuring an executive, confident tone free of casual street slang.
          </p>

          <div className="space-y-2.5">
            {voiceRules.map((rule) => (
              <div key={rule.id} className="p-3 rounded border border-slate-200/70 bg-slate-50/50 space-y-1">
                <span className="text-[10px] uppercase font-mono text-slate-400 font-semibold block">Rule Definition:</span>
                <p className="text-slate-800 font-medium leading-relaxed font-sans">
                  "{rule.text}"
                </p>
              </div>
            ))}
          </div>

          <div className="p-2.5 rounded bg-slate-50 border border-slate-200/60 text-[11px] text-slate-600 leading-relaxed font-sans">
            <strong>Prohibited Slang:</strong> yo, dope, gonna, lol, omg, lit, and repeated exclamation points (!!+).
          </div>
        </div>
      </div>
    </div>
  );
}

// --- Insights View (Minimalist Linear / Sparkline Analytics) ---
function InsightsView({ sessionIssues = [], onNavigateToWorkspace }) {
  const [filter, setFilter] = useState('all');

  const getCat = (iss) => {
    const t = (iss.type || '').toLowerCase();
    if (t.includes('claim')) return 'claim';
    if (t.includes('tone')) return 'tone';
    if (t.includes('term')) return 'terminology';
    if (t.includes('visual') || t.includes('color')) return 'visual';
    return 'other';
  };

  const total = sessionIssues.length;
  const claimsCount = sessionIssues.filter(i => getCat(i) === 'claim').length;
  const toneCount = sessionIssues.filter(i => getCat(i) === 'tone').length;
  const termCount = sessionIssues.filter(i => getCat(i) === 'terminology').length;
  const visualCount = sessionIssues.filter(i => getCat(i) === 'visual').length;
  const resolvedCount = sessionIssues.filter(i => i.status === 'resolved').length;

  const filteredIssues = filter === 'all'
    ? sessionIssues
    : sessionIssues.filter(i => getCat(i) === filter);

  return (
    <div className="max-w-7xl mx-auto space-y-4 animate-fadeIn">
      {/* Top Banner */}
      <div className="bg-white border border-slate-200/80 rounded-lg p-3.5 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
        <div>
          <h2 className="font-semibold text-slate-900 text-sm">Governance Session Analytics</h2>
          <p className="text-slate-500 text-[11px] mt-0.5">
            Live telemetry computed dynamically across all drafts audited during this active session.
          </p>
        </div>

        <button
          type="button"
          onClick={onNavigateToWorkspace}
          className="px-3 py-1.5 text-xs font-medium rounded bg-slate-900 text-white hover:bg-slate-800 shadow-xs transition-colors self-start sm:self-auto"
        >
          Review Copy →
        </button>
      </div>

      {/* 5 Summary Cards */}
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 text-xs">
        <div className="bg-white p-3.5 rounded-lg border border-slate-200/80 shadow-xs">
          <span className="text-[11px] text-slate-500 font-medium">Total Violations</span>
          <div className="text-2xl font-bold text-slate-900 mt-1 font-mono">{total}</div>
          <span className="text-[10px] text-slate-400 font-mono mt-0.5 block">{resolvedCount} resolved</span>
        </div>

        <div className="bg-white p-3.5 rounded-lg border border-slate-200/80 shadow-xs">
          <div className="flex items-center justify-between">
            <span className="text-[11px] text-rose-700 font-medium">Claims §4</span>
            <span className="text-[9px] font-mono px-1 rounded bg-rose-50 text-rose-700 border border-rose-200">High</span>
          </div>
          <div className="text-2xl font-bold text-slate-900 mt-1 font-mono">{claimsCount}</div>
          <span className="text-[10px] text-slate-400 font-mono mt-0.5 block">
            {total > 0 ? Math.round((claimsCount / total) * 100) : 0}% of volume
          </span>
        </div>

        <div className="bg-white p-3.5 rounded-lg border border-slate-200/80 shadow-xs">
          <div className="flex items-center justify-between">
            <span className="text-[11px] text-amber-700 font-medium">Tone Voice</span>
            <span className="text-[9px] font-mono px-1 rounded bg-amber-50 text-amber-700 border border-amber-200">Med</span>
          </div>
          <div className="text-2xl font-bold text-slate-900 mt-1 font-mono">{toneCount}</div>
          <span className="text-[10px] text-slate-400 font-mono mt-0.5 block">
            {total > 0 ? Math.round((toneCount / total) * 100) : 0}% of volume
          </span>
        </div>

        <div className="bg-white p-3.5 rounded-lg border border-slate-200/80 shadow-xs">
          <div className="flex items-center justify-between">
            <span className="text-[11px] text-sky-700 font-medium">Terminology</span>
            <span className="text-[9px] font-mono px-1 rounded bg-sky-50 text-sky-700 border border-sky-200">Low</span>
          </div>
          <div className="text-2xl font-bold text-slate-900 mt-1 font-mono">{termCount}</div>
          <span className="text-[10px] text-slate-400 font-mono mt-0.5 block">
            {total > 0 ? Math.round((termCount / total) * 100) : 0}% of volume
          </span>
        </div>

        <div className="bg-white p-3.5 rounded-lg border border-slate-200/80 shadow-xs">
          <div className="flex items-center justify-between">
            <span className="text-[11px] text-purple-700 font-medium">Visual Palette</span>
            <span className="text-[9px] font-mono px-1 rounded bg-purple-50 text-purple-700 border border-purple-200">Med</span>
          </div>
          <div className="text-2xl font-bold text-slate-900 mt-1 font-mono">{visualCount}</div>
          <span className="text-[10px] text-slate-400 font-mono mt-0.5 block">
            {total > 0 ? Math.round((visualCount / total) * 100) : 0}% of volume
          </span>
        </div>
      </div>

      {/* Linear Style Segmented Distribution Sparkline */}
      {total > 0 && (
        <div className="bg-white border border-slate-200/80 rounded-lg p-4 shadow-xs space-y-2 text-xs">
          <div className="flex items-center justify-between text-[11px] text-slate-500 font-medium">
            <span>Category Ratio Breakdown</span>
            <span className="font-mono text-slate-600">
              {claimsCount} claim • {toneCount} tone • {termCount} terminology • {visualCount} visual
            </span>
          </div>

          <div className="h-2 w-full bg-slate-100 rounded-full overflow-hidden flex">
            {claimsCount > 0 && (
              <div
                style={{ width: `${(claimsCount / total) * 100}%` }}
                className="bg-rose-500 h-full transition-all"
                title={`Claims: ${claimsCount}`}
              />
            )}
            {toneCount > 0 && (
              <div
                style={{ width: `${(toneCount / total) * 100}%` }}
                className="bg-amber-400 h-full transition-all"
                title={`Tone: ${toneCount}`}
              />
            )}
            {termCount > 0 && (
              <div
                style={{ width: `${(termCount / total) * 100}%` }}
                className="bg-sky-500 h-full transition-all"
                title={`Terminology: ${termCount}`}
              />
            )}
            {visualCount > 0 && (
              <div
                style={{ width: `${(visualCount / total) * 100}%` }}
                className="bg-purple-500 h-full transition-all"
                title={`Visual Consistency: ${visualCount}`}
              />
            )}
          </div>
        </div>
      )}

      {/* Interactive Audit Stream Table */}
      <div className="bg-white border border-slate-200/80 rounded-lg p-4 shadow-xs space-y-3 text-xs">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <span className="font-semibold text-slate-900">Session Audit Activity Stream</span>

          <div className="inline-flex rounded-md bg-slate-100 p-0.5 border border-slate-200/60">
            {['all', 'claim', 'tone', 'terminology', 'visual'].map((f) => (
              <button
                key={f}
                type="button"
                onClick={() => setFilter(f)}
                className={`px-2.5 py-1 rounded text-[11px] font-medium capitalize transition-all ${filter === f
                  ? 'bg-white text-slate-900 shadow-xs'
                  : 'text-slate-500 hover:text-slate-800'
                  }`}
              >
                {f}
              </button>
            ))}
          </div>
        </div>

        <div className="overflow-x-auto">
          <table className="w-full text-left text-xs border-collapse">
            <thead>
              <tr className="border-b border-slate-200 text-slate-400 font-mono text-[10px] uppercase">
                <th className="py-2 px-2">Time</th>
                <th className="py-2 px-2">Category</th>
                <th className="py-2 px-2">Flagged Snippet</th>
                <th className="py-2 px-2">Status</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {filteredIssues.map((iss) => (
                <tr key={iss.id} className="hover:bg-slate-50/70">
                  <td className="py-2 px-2 font-mono text-[11px] text-slate-400">{iss.detectedAt || 'Session'}</td>
                  <td className="py-2 px-2">
                    <SeverityBadge severity={iss.severity} type={iss.type} />
                  </td>
                  <td className="py-2 px-2 font-mono text-slate-800 text-[11px]">
                    "{iss.snippet}"
                  </td>
                  <td className="py-2 px-2">
                    <span className="inline-flex items-center px-1.5 py-0.2 rounded text-[10px] font-medium bg-emerald-50 text-emerald-700 border border-emerald-200/60 font-mono">
                      {iss.status || 'resolved'}
                    </span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// --- Main Application Shell ---
function BrandSentryApp() {
  const [activeTab, setActiveTab] = useState('review');
  const [userRole, setUserRole] = useState('Reviewer'); // 'Creator' | 'Reviewer' (pre-default to Reviewer)
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  // In-Memory Seed State
  const [glossary, setGlossary] = useState(INITIAL_GLOSSARY);
  const [claims, setClaims] = useState(INITIAL_CLAIMS);
  const [voiceRules, setVoiceRules] = useState(INITIAL_VOICE_RULES);
  const [palette, setPalette] = useState(INITIAL_PALETTE);
  const [sessionIssues, setSessionIssues] = useState(INITIAL_SESSION_ISSUES);

  // Content Items in pipeline
  const [contentItems, setContentItems] = useState([
    {
      id: 'ci-init-1',
      text: '',
      brandColor: '',
      contentType: 'Email',
      submittedAt: null,
      approvedAt: null,
      issues: [],
      status: 'draft',
      reviewerComment: ''
    },
    {
      id: 'ci-preload-pending',
      text: "Welcome to our Onboarding Portal! Our enterprise cloud engine is up to 35% faster in batch-processing tests based on our internal benchmark. Explore all dedicated tools built for our Members.",
      brandColor: '#1F2A44',
      contentType: 'Email',
      submittedAt: 'Today, 10:30 AM',
      approvedAt: null,
      issues: [
        { id: 'iss-seed-1', type: 'Terminology inconsistency', severity: 'Low', snippet: 'Sign-Up Portal', status: 'resolved', resolution: 'Replaced with "Onboarding Portal"' },
        { id: 'iss-seed-2', type: 'Unsupported claim', severity: 'High', snippet: '10x', status: 'resolved', resolution: 'Capped to approved internal benchmark' },
        { id: 'iss-seed-3', type: 'Tone mismatch', severity: 'Medium', snippet: 'Yo!!', status: 'resolved', resolution: 'Neutralized tone to professional & friendly' }
      ],
      status: 'pending_approval',
      reviewerComment: ''
    },
    {
      id: 'ci-preload-approved',
      text: "Announcing the Q3 Release for all Members: experience secure, automated compliance checks directly within the Onboarding Portal.",
      brandColor: '#FFFFFF',
      contentType: 'Web Page',
      submittedAt: 'Yesterday, 03:45 PM',
      approvedAt: 'Yesterday, 04:30 PM',
      issues: [
        { id: 'iss-seed-4', type: 'Terminology inconsistency', severity: 'Low', snippet: 'Customers', status: 'resolved', resolution: 'Replaced with "Members"' }
      ],
      status: 'approved',
      reviewerComment: 'Verified against Voice and Claims sheet v2.3. Ready for publishing.'
    }
  ]);

  const [activeItemId, setActiveItemId] = useState('ci-init-1');
  const currentItem = contentItems.find(i => i.id === activeItemId) || contentItems[0];

  const updateActiveItem = (patch) => {
    setContentItems(prev => prev.map(item => item.id === currentItem.id ? { ...item, ...patch } : item));
  };

  // Review Content trigger (evaluates text + brand color)
  const handleReviewContent = () => {
    if (!currentItem.text.trim()) return;
    const detected = window.reviewContent(
      currentItem.text,
      glossary,
      claims,
      voiceRules,
      currentItem.brandColor,
      palette
    );
    updateActiveItem({
      issues: detected,
      status: 'in_review'
    });

    if (detected.length > 0) {
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const withMeta = detected.map(d => ({
        ...d,
        detectedAt: timeStr,
        contentType: currentItem.contentType
      }));
      setSessionIssues(prev => [...prev, ...withMeta]);
    }
  };

  // Accept issue suggestion
  const handleAcceptIssue = (issue) => {
    // Visual consistency resolution
    if (issue.type === 'Visual consistency') {
      const updatedIssues = currentItem.issues.map(iss =>
        iss.id === issue.id
          ? { ...iss, status: 'resolved', resolution: `Updated brand color to ${issue.suggestedRewrite}` }
          : iss
      );
      updateActiveItem({
        brandColor: issue.suggestedRewrite,
        issues: updatedIssues
      });
      setSessionIssues(prev => prev.map(iss =>
        iss.id === issue.id ? { ...iss, status: 'resolved' } : iss
      ));
      return;
    }

    let updatedText = currentItem.text;

    if (issue.type === 'Terminology inconsistency') {
      const matched = glossary.find(g => g.avoidTerm.toLowerCase() === issue.snippet.toLowerCase());
      const rep = matched ? matched.approvedTerm : issue.suggestedRewrite;
      const reg = new RegExp(`\\b${window.escapeRegExp(issue.snippet)}\\b`, 'gi');
      updatedText = updatedText.replace(reg, rep);
    } else if (issue.type === 'Unsupported claim') {
      if (issue.snippet.toLowerCase() === '10x' && /\b10x\s+faster\b/i.test(updatedText)) {
        updatedText = updatedText.replace(/\b10x\s+faster\b/i, issue.suggestedRewrite);
      } else {
        const reg = new RegExp(`\\b${window.escapeRegExp(issue.snippet)}\\b`, 'i');
        updatedText = updatedText.replace(reg, issue.suggestedRewrite);
      }
    } else if (issue.type === 'Tone mismatch') {
      updatedText = updatedText.replace(/!{2,}/g, '.');
      const slangWords = ["yo", "dope", "gonna", "lol", "omg", "lit"];
      for (const slang of slangWords) {
        const reg = new RegExp(`\\b${slang}\\b[!,]?\\s*`, 'gi');
        updatedText = updatedText.replace(reg, '');
      }
      updatedText = updatedText.trim();
      if (updatedText.length > 0) {
        updatedText = updatedText.charAt(0).toUpperCase() + updatedText.slice(1);
      }
    }

    const updatedIssues = currentItem.issues.map(iss =>
      iss.id === issue.id
        ? { ...iss, status: 'resolved', resolution: 'Accepted suggested rewrite' }
        : iss
    );

    updateActiveItem({
      text: updatedText,
      issues: updatedIssues
    });

    setSessionIssues(prev => prev.map(iss =>
      iss.id === issue.id ? { ...iss, status: 'resolved' } : iss
    ));
  };

  // Custom edit issue
  const handleEditIssue = (issue, customReplacement) => {
    // Visual consistency custom edit
    if (issue.type === 'Visual consistency') {
      const updatedIssues = currentItem.issues.map(iss =>
        iss.id === issue.id
          ? { ...iss, status: 'resolved', resolution: `Custom color: "${customReplacement}"` }
          : iss
      );
      updateActiveItem({
        brandColor: customReplacement.toUpperCase(),
        issues: updatedIssues
      });
      setSessionIssues(prev => prev.map(iss =>
        iss.id === issue.id ? { ...iss, status: 'resolved' } : iss
      ));
      return;
    }

    let updatedText = currentItem.text;
    const reg = new RegExp(window.escapeRegExp(issue.snippet), 'i');
    if (reg.test(updatedText)) {
      updatedText = updatedText.replace(reg, customReplacement);
    } else {
      updatedText = customReplacement;
    }

    const updatedIssues = currentItem.issues.map(iss =>
      iss.id === issue.id
        ? { ...iss, status: 'resolved', resolution: `Custom: "${customReplacement}"` }
        : iss
    );

    updateActiveItem({
      text: updatedText,
      issues: updatedIssues
    });

    setSessionIssues(prev => prev.map(iss =>
      iss.id === issue.id ? { ...iss, status: 'resolved' } : iss
    ));
  };

  // Dismiss issue
  const handleDismissIssue = (issue, comment) => {
    const updatedIssues = currentItem.issues.map(iss =>
      iss.id === issue.id
        ? { ...iss, status: 'resolved', resolution: `Dismissed: "${comment}"` }
        : iss
    );

    updateActiveItem({
      issues: updatedIssues
    });

    setSessionIssues(prev => prev.map(iss =>
      iss.id === issue.id ? { ...iss, status: 'resolved' } : iss
    ));
  };

  // Send for Review (strict gate)
  const handleSendForReview = () => {
    const openCount = (currentItem.issues || []).filter(i => i.status === 'open').length;
    if (openCount > 0) return;

    updateActiveItem({
      status: 'pending_approval',
      submittedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });
  };

  const handleApproveItem = (id, comment) => {
    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    setContentItems(prev => prev.map(item =>
      item.id === id ? { ...item, status: 'approved', approvedAt: timeStr, reviewerComment: comment } : item
    ));
  };

  const handleSendBackItem = (id, comment) => {
    setContentItems(prev => prev.map(item =>
      item.id === id ? { ...item, status: 'sent_back', reviewerComment: comment } : item
    ));
  };

  const handleEditInWorkspace = (id) => {
    setActiveItemId(id);
    setActiveTab('review');
  };

  const handleAddGlossaryPair = (avoidTerm, approvedTerm) => {
    const newPair = {
      id: `g${Date.now()}`,
      avoidTerm: avoidTerm.trim(),
      approvedTerm: approvedTerm.trim()
    };
    setGlossary(prev => [...prev, newPair]);
  };

  const handleDeleteGlossaryPair = (id) => {
    setGlossary(prev => prev.filter(item => item.id !== id));
  };

  const handleAddColor = (name, hex) => {
    const newColor = {
      id: `p${Date.now()}`,
      name: name.trim(),
      hex: (hex.trim().startsWith('#') ? hex.trim() : `#${hex.trim()}`).toUpperCase()
    };
    setPalette(prev => [...prev, newColor]);
  };

  const handleDeleteColor = (id) => {
    setPalette(prev => prev.filter(item => item.id !== id));
  };

  const pendingCount = contentItems.filter(i => i.status === 'pending_approval').length;

  const navItems = [
    { id: 'review', label: 'Review Workspace', icon: FileTextIcon },
    { id: 'approval', label: 'Approval Board', icon: ColumnsIcon, badge: pendingCount > 0 ? pendingCount : undefined },
    { id: 'knowledge', label: 'Knowledge Base', icon: BookOpenIcon, badge: glossary.length + claims.length + voiceRules.length + palette.length },
    { id: 'insights', label: 'Insights', icon: BarChart3Icon, badge: sessionIssues.length }
  ];

  return (
    <div className="min-h-screen bg-slate-50/60 text-slate-900 font-sans flex flex-col antialiased">
      {/* Sleek Enterprise Top Bar (Linear / Vercel style) */}
      <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-4 sm:px-6 h-14 flex items-center justify-between">
        {/* Brand Mark & Title */}
        <div className="flex items-center space-x-3">
          <div className="w-7 h-7 rounded-md bg-slate-900 text-white flex items-center justify-center shadow-xs">
            <SentryLogo className="w-4 h-4" />
          </div>
          <div className="flex items-center space-x-2">
            <span className="font-semibold text-sm tracking-tight text-slate-900">BrandSentry</span>
            <span className="text-[10px] font-mono text-slate-400 bg-slate-100 px-1.5 py-0.2 rounded border border-slate-200/60 hidden sm:inline-block">
              v1.2
            </span>
          </div>
        </div>

        {/* Center Pill-Tabs Navigation */}
        <nav className="hidden md:flex items-center space-x-1 bg-slate-100/80 p-0.5 rounded-lg border border-slate-200/60">
          {navItems.map((item) => {
            const Icon = item.icon;
            const isActive = activeTab === item.id;
            return (
              <button
                key={item.id}
                onClick={() => setActiveTab(item.id)}
                className={`flex items-center space-x-2 px-3 py-1.5 rounded-md text-xs font-medium transition-all ${isActive
                  ? 'bg-white text-slate-900 shadow-xs font-semibold'
                  : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/40'
                  }`}
              >
                <Icon className={`w-3.5 h-3.5 ${isActive ? 'text-slate-900' : 'text-slate-400'}`} />
                <span>{item.label}</span>
                {item.badge !== undefined && (
                  <span className={`text-[10px] font-mono px-1.5 py-0.2 rounded-full ${isActive ? 'bg-slate-100 text-slate-700' : 'bg-slate-200/80 text-slate-500'
                    }`}>
                    {item.badge}
                  </span>
                )}
              </button>
            );
          })}
        </nav>

        {/* Right Section: Role Switcher & Hackathon Tag */}
        <div className="flex items-center space-x-3">
          {/* Segmented Role Switcher Toggle */}
          <div className="flex items-center bg-slate-100 p-0.5 rounded-md border border-slate-200/80 text-xs">
            <button
              type="button"
              onClick={() => setUserRole('Creator')}
              className={`px-2.5 py-1 rounded text-[11px] font-medium transition-all ${userRole === 'Creator'
                ? 'bg-white text-slate-900 shadow-xs font-semibold'
                : 'text-slate-500 hover:text-slate-800'
                }`}
            >
              Creator
            </button>
            <button
              type="button"
              onClick={() => setUserRole('Reviewer')}
              className={`px-2.5 py-1 rounded text-[11px] font-medium transition-all flex items-center space-x-1 ${userRole === 'Reviewer'
                ? 'bg-slate-900 text-white shadow-xs font-semibold'
                : 'text-slate-500 hover:text-slate-800'
                }`}
            >
              <span>Reviewer</span>
              <span className={`w-1.5 h-1.5 rounded-full ${userRole === 'Reviewer' ? 'bg-emerald-400' : 'bg-transparent'}`}></span>
            </button>
          </div>

          <span className="hidden lg:inline-flex text-[11px] font-medium text-slate-400 border border-slate-200/80 bg-slate-50 px-2 py-0.5 rounded">
            DviCoders
          </span>
        </div>
      </header>

      {/* Main Dynamic View Content */}
      <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 overflow-x-hidden">
        {activeTab === 'review' && (
          <ReviewWorkspaceView
            activeItem={currentItem}
            onUpdateDraft={updateActiveItem}
            onReviewContent={handleReviewContent}
            onAcceptIssue={handleAcceptIssue}
            onEditIssue={handleEditIssue}
            onDismissIssue={handleDismissIssue}
            onSendForReview={handleSendForReview}
          />
        )}
        {activeTab === 'approval' && (
          <ApprovalBoardView
            contentItems={contentItems}
            userRole={userRole}
            onRoleChange={setUserRole}
            onApprove={handleApproveItem}
            onSendBack={handleSendBackItem}
            onEditInWorkspace={handleEditInWorkspace}
          />
        )}
        {activeTab === 'knowledge' && (
          <KnowledgeBaseView
            glossary={glossary}
            claims={claims}
            voiceRules={voiceRules}
            palette={palette}
            onAddGlossaryPair={handleAddGlossaryPair}
            onDeleteGlossaryPair={handleDeleteGlossaryPair}
            onAddColor={handleAddColor}
            onDeleteColor={handleDeleteColor}
          />
        )}
        {activeTab === 'insights' && (
          <InsightsView
            sessionIssues={sessionIssues}
            onNavigateToWorkspace={() => setActiveTab('review')}
          />
        )}
      </main>

      {/* Mobile Bottom Thumb Navigation */}
      <nav className="md:hidden sticky bottom-0 bg-white/95 backdrop-blur-md border-t border-slate-200 grid grid-cols-4 px-2 py-1 z-30 shadow-xs">
        {navItems.map((item) => {
          const Icon = item.icon;
          const isActive = activeTab === item.id;
          const shortLabels = { review: 'Review', approval: 'Board', knowledge: 'Knowledge', insights: 'Insights' };
          return (
            <button
              key={item.id}
              onClick={() => setActiveTab(item.id)}
              className={`flex flex-col items-center justify-center py-1 rounded text-[10px] font-medium transition-colors ${isActive ? 'text-slate-900 font-bold' : 'text-slate-500'
                }`}
            >
              <div className="relative">
                <Icon className="w-4 h-4" />
                {item.badge !== undefined && (
                  <span className="absolute -top-1 -right-2 bg-slate-900 text-white text-[8px] min-w-[12px] h-[12px] px-0.5 rounded-full flex items-center justify-center font-mono">
                    {item.badge}
                  </span>
                )}
              </div>
              <span className="mt-0.5">{shortLabels[item.id] || item.label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

// Mount the React Application
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BrandSentryApp />);
  </script>
